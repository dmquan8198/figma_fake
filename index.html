<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xưởng Vẽ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.3/dist/polygon-clipping.umd.min.js"></script>
<style>
/* Bố cục: thanh trên cùng, trang và lớp bên trái, canvas ở giữa, thuộc tính bên phải */
:root{
  --bg:#f1f1f3; --panel:#ffffff; --line:#dedee3; --fg:#1c1c21; --muted:#6c6c76;
  --hover:#ececf0; --input:#f1f1f4; --canvas:#e4e4e9; --dot:#c2c2cb;
  --accent:#e8501f; --accent-fg:#ffffff; --accent-soft:rgba(232,80,31,.12); --comp:#7c4dff;
  --guide:#f0307a; --shadow:0 8px 28px rgba(20,20,30,.18);
  --ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17171a; --panel:#1f1f24; --line:#303037; --fg:#ececf0; --muted:#8e8e99;
  --hover:#2a2a31; --input:#2a2a31; --canvas:#101013; --dot:#2c2c34;
  --accent:#ff6a3d; --accent-fg:#16110f; --accent-soft:rgba(255,106,61,.16); --comp:#a58bff;
  --guide:#ff5c9a; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17171a; --panel:#1f1f24; --line:#303037; --fg:#ececf0; --muted:#8e8e99;
  --hover:#2a2a31; --input:#2a2a31; --canvas:#101013; --dot:#2c2c34;
  --accent:#ff6a3d; --accent-fg:#16110f; --accent-soft:rgba(255,106,61,.16); --comp:#a58bff;
  --guide:#ff5c9a; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg.i{display:block;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

#app{height:100%;display:flex;flex-direction:column}
header{flex:none;height:46px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;margin-right:4px;white-space:nowrap}
.brand i{width:20px;height:20px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg)}
.grp{display:flex;gap:2px;align-items:center;flex:none}
.sep{width:1px;height:20px;background:var(--line);margin:0 6px;flex:none}
.sp{flex:1;min-width:8px}
.tb{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.tb:hover{background:var(--hover);color:var(--fg)}
.tb.on{background:var(--accent);color:var(--accent-fg)}
.tb:disabled{opacity:.35;cursor:default}
.tb:disabled:hover{background:none;color:var(--muted)}
.txt{height:32px;padding:0 12px;border-radius:8px;font-weight:600;white-space:nowrap;flex:none}
.txt.pri{background:var(--accent);color:var(--accent-fg)}
.txt.pri:hover{filter:brightness(1.08)}
.txt.ghost{color:var(--muted)}
.txt.ghost:hover{background:var(--hover);color:var(--fg)}
#zoomv{font:500 12px var(--mono);min-width:58px;height:30px;border-radius:7px;color:var(--fg);display:flex;align-items:center;justify-content:center;gap:3px}
#zoomv:hover{background:var(--hover)}
.only-s{display:none}

main{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr) 264px;position:relative;overflow:hidden}
aside{background:var(--panel);overflow-y:auto;min-height:0;scrollbar-width:thin}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.ph{position:sticky;top:0;background:var(--panel);z-index:2;padding:12px 14px 8px;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph.s2{position:static;padding-top:16px}
.ph .mini{width:24px;height:24px}
.row{display:flex;align-items:center;gap:6px;height:30px;padding-right:6px;margin:0 6px;border-radius:6px;cursor:default;color:var(--fg);user-select:none;position:relative}
.row:hover{background:var(--hover)}
.row.on{background:var(--accent-soft)}
.row .ic{color:var(--muted);flex:none}
.row.on .ic{color:var(--accent)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.dim .nm,.row.dim .ic{opacity:.45}
.row input{flex:1;min-width:0;font:inherit;background:var(--input);color:var(--fg);border:1px solid var(--accent);border-radius:4px;padding:1px 4px}
.row .ab{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--muted);opacity:0}
.row:hover .ab,.row .ab.act{opacity:1}
.row .ab:hover{background:var(--line);color:var(--fg)}
.row .chev{width:16px;height:22px;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:4px}
.row .chev:hover{background:var(--line)}
.row .chev.sp0{visibility:hidden}
.row.dt-b::after,.row.dt-a::after{content:"";position:absolute;left:4px;right:4px;height:2px;background:var(--accent);border-radius:1px}
.row.dt-b::after{top:-1px}.row.dt-a::after{bottom:-1px}
.row.dt-i{outline:2px solid var(--accent);outline-offset:-2px}
.row.cur{background:var(--accent-soft);font-weight:600}
.empty{padding:6px 16px;color:var(--muted)}
.srch{margin:0 10px 6px;display:block;width:calc(100% - 20px);height:28px;border-radius:7px;border:0;background:var(--input);color:var(--fg);padding:0 10px;font:inherit}
.cnt{font:500 11px var(--mono);color:var(--muted)}

#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--canvas)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none}
#cvs,#ovs{position:absolute;inset:0;width:100%;height:100%;display:block}
#ovs{pointer-events:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#world>svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#te{position:absolute;margin:0;padding:0;border:1px solid var(--accent);background:transparent;outline:none;overflow:visible;z-index:3;transform-origin:50% 50%;word-break:normal;overflow-wrap:break-word}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:12px;color:var(--muted);pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:999px;font-size:12px;z-index:5;pointer-events:none;max-width:92%}
#toast[hidden]{display:none}
#dropmark{position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);z-index:4;display:grid;place-items:center;color:var(--accent);font-weight:600;pointer-events:none}
#dropmark[hidden]{display:none}

.tabs{display:flex;gap:2px;margin:10px 12px 2px;background:var(--input);border-radius:8px;padding:2px;position:sticky;top:0;z-index:3}
.tabs button{flex:1;height:26px;border-radius:6px;font-weight:600;font-size:12px;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.sec{padding:12px 14px;border-top:1px solid var(--line)}
.sec.nb{border-top:0}
.sec h4{margin:0 0 9px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.sec h4 .mini{width:22px;height:22px;margin:-4px -4px -4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.gap8{margin-top:8px}
.fld{display:flex;align-items:center;gap:6px;background:var(--input);border-radius:7px;padding:0 8px;height:30px;min-width:0}
.fld span{color:var(--muted);font:500 11px var(--mono);flex:none;min-width:12px;cursor:ew-resize;user-select:none;text-align:center}
.fld input,.fld select{flex:1;min-width:0;width:100%;background:none;border:0;color:var(--fg);font:500 12px var(--mono);padding:0;height:100%}
.fld select{font-family:var(--ui)}
.fld select option{background:var(--panel)}
input[type=number]::-webkit-inner-spin-button{opacity:.5}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.crow:last-child{margin-bottom:0}
.crow>b{width:50px;font-weight:500;color:var(--muted);flex:none}
.sw{position:relative;width:30px;height:30px;border-radius:7px;border:1px solid var(--line);overflow:hidden;flex:none;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/10px 10px}
.sw input{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);border:0;padding:0;cursor:pointer;background:none}
.sw.sm{width:24px;height:24px;border-radius:6px}
.sw .fillbg{position:absolute;inset:0;pointer-events:none}
.hex{flex:1;min-width:0}
.mini{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none}
.mini:hover{background:var(--hover);color:var(--fg)}
.mini.on{background:var(--accent-soft);color:var(--accent)}
.alg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.alg .tb{width:100%;height:30px}
.alg.six{grid-template-columns:repeat(6,1fr)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:32px;border-radius:7px;background:var(--input);font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.dng{color:#d93a3a}
.btn.on{background:var(--accent);color:var(--accent-fg)}
.btn.full{width:100%}
textarea.tx{width:100%;min-height:62px;resize:vertical;background:var(--input);border:0;border-radius:7px;padding:7px 9px;color:var(--fg);font:inherit}
.help{padding:4px 14px 18px;color:var(--muted)}
.help p{margin:0 0 12px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-bottom:12px}
kbd{font:500 11px var(--mono);background:var(--input);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--fg);justify-self:start}
.kh{font-size:11px;font-weight:600;color:var(--fg);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 6px}
.note{font-size:12px;border-left:2px solid var(--accent);padding:2px 0 2px 10px;margin:0 0 12px}
.rowlbl{font-size:12px;color:var(--muted);margin:10px 0 4px}
.alg2{display:flex;gap:2px;background:var(--input);border-radius:7px;padding:2px}
.alg2 .tb{flex:1;width:auto;height:26px}
.alg3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--input);border-radius:7px;padding:2px}
.alg3 .tb{width:auto;height:26px}
.seg{display:flex;gap:2px;background:var(--input);border-radius:7px;padding:2px}
.seg .tb{flex:1;width:auto;height:26px}
.ovl{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}
.ovl .tx{margin-top:4px;color:var(--fg);min-height:34px}
.pal{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pal button{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);flex:none}
.pal button:hover{transform:scale(1.15)}
.stop{display:grid;grid-template-columns:62px 30px 1fr 24px;gap:6px;align-items:center;margin-bottom:6px}
.fxc{background:var(--input);border-radius:8px;padding:8px;margin-bottom:8px}
.fxc .hd{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-weight:600;font-size:12px}
.fxc .hd span{flex:1}
.fxc .fld{background:var(--panel)}
pre.css{margin:0;background:var(--input);border-radius:8px;padding:10px;font:11.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--fg)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;font-weight:600}
.chip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.chip button:hover{background:var(--accent);color:var(--accent-fg)}

#pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:190px;max-width:290px;max-height:70vh;overflow:auto}
#pop[hidden]{display:none}
#pop .it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border-radius:6px;min-height:30px}
#pop .it:hover{background:var(--hover)}
#pop .it kbd{margin-left:auto}
#pop .it.on{color:var(--accent);font-weight:600}
#pop .sp1{height:1px;background:var(--line);margin:5px 4px}
#pop .lb{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px 2px}
#pop input[type=text]{width:100%;height:30px;border:0;border-radius:6px;background:var(--input);color:var(--fg);padding:0 8px;font:inherit;margin:4px 0}

#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(660px,100%);max-height:90%;display:flex;flex-direction:column;overflow:hidden}
.card header{border:0;height:auto;padding:14px 16px 6px;font-weight:700;font-size:15px;justify-content:space-between}
.cbody{padding:8px 16px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.prev{background:var(--canvas);border-radius:10px;padding:14px;display:grid;place-items:center;min-height:120px;max-height:260px;overflow:auto}
.prev img{max-width:100%;max-height:230px;display:block}
#code{width:100%;height:120px;resize:vertical;background:var(--input);border:0;border-radius:8px;padding:8px 10px;color:var(--fg);font:11.5px/1.45 var(--mono)}
.crow2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#msg{color:var(--muted);font-size:12px}

#pres{position:fixed;inset:0;z-index:40;background:#111114;display:flex;flex-direction:column;color:#eee}
#pres[hidden]{display:none}
#pres .pbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#1b1b20;font-size:12px}
#pres .pbar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pres .pbar button{height:28px;padding:0 12px;border-radius:7px;background:#2c2c34;color:#eee;font-weight:600}
#pres .pbar button:hover{background:#3a3a44}
#pres .pstage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;position:relative}
#pres .pwrap{position:relative;overflow:hidden;background:transparent}
#pres .pf{position:absolute;inset:0;transition:transform .35s ease,opacity .35s ease}
#pres .pf svg{display:block;width:100%;height:100%}
#pres .hot{position:absolute;cursor:pointer;border-radius:4px}
#pres.hint .hot{outline:2px solid rgba(255,90,60,.9);background:rgba(255,90,60,.12)}

@media (max-width:860px){
  main{grid-template-columns:minmax(0,1fr)}
  aside{position:absolute;top:0;bottom:0;width:min(290px,86vw);z-index:6;transition:transform .18s ease;box-shadow:0 0 30px rgba(0,0,0,.25)}
  #left{left:0;transform:translateX(-105%)}
  #right{right:0;transform:translateX(105%)}
  #left.open,#right.open{transform:none}
  .only-s{display:grid}
  .brand span,#hint{display:none}
  .row .ab{opacity:1}
  /* điện thoại: dãy công cụ vẽ xuống thanh dưới, thanh trên chỉ giữ nút thiết yếu */
  header{gap:4px;padding:0 6px;overflow:hidden}
  header>.sep,.brand,#savest,#zin,#zout{display:none}
  #zoomv{min-width:44px}
  #tools{position:fixed;left:0;right:0;bottom:0;height:54px;z-index:7;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding:0 8px;gap:4px;padding-bottom:env(safe-area-inset-bottom)}
  #tools::-webkit-scrollbar{display:none}
  #tools .tb{width:42px;height:42px}
  main{padding-bottom:54px}
  aside{bottom:54px}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}#pres .pf{transition:none}}

.card.wide{width:min(980px,100%)}
.fld .vb{width:18px;height:18px;border-radius:5px;display:none;place-items:center;color:var(--muted);flex:none}
.fld:hover .vb,.fld:focus-within .vb,.fld.bound .vb{display:grid}
@media (hover:none){.fld .vb{display:grid}}
.fld .vb:hover{background:var(--line);color:var(--comp)}
.fld.bound{background:color-mix(in srgb,var(--comp) 13%,var(--input))}
.fld.bound span{color:var(--comp)}

#rtb{position:absolute;z-index:4;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:var(--shadow)}
#rtb[hidden]{display:none}
#rtb button{min-width:26px;height:26px;border-radius:6px;font-size:13px;display:grid;place-items:center;padding:0 5px}
#rtb button:hover{background:var(--hover)}
#rtb button[data-rcol]{width:18px;min-width:18px;height:18px;border:1px solid var(--line);margin:0 1px;border-radius:50%;padding:0}
#rtb .rs{width:1px;height:16px;background:var(--line);margin:0 3px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><i><svg class="i" width="13" height="13" viewBox="0 0 16 16" style="stroke-width:2"><path d="M3 13L8 3l5 10M5 9.5h6"/></svg></i><span>Xưởng Vẽ</span></div>
    <button class="tb only-s" id="tgL" title="Lớp và trang" aria-label="Mở lớp và trang"></button>
    <button class="tb" id="menuBtn" title="Tệp và tuỳ chọn" aria-label="Tệp và tuỳ chọn"></button>
    <div class="sep"></div>
    <div class="grp" id="tools"></div>
    <div class="sep"></div>
    <div class="grp">
      <button class="tb" id="undo" title="Hoàn tác (Ctrl+Z)" aria-label="Hoàn tác"></button>
      <button class="tb" id="redo" title="Làm lại (Ctrl+Shift+Z)" aria-label="Làm lại"></button>
    </div>
    <div class="sp"></div>
    <span id="savest" style="font-size:11px;color:var(--muted);white-space:nowrap;margin-right:6px"></span>
    <button class="tb" id="presBtn" title="Trình chiếu nguyên mẫu (Ctrl+Alt+Enter)" aria-label="Trình chiếu"></button>
    <div class="grp">
      <button class="tb" id="zout" title="Thu nhỏ" aria-label="Thu nhỏ"></button>
      <button id="zoomv" title="Tuỳ chọn zoom"><span id="zval">100%</span></button>
      <button class="tb" id="zin" title="Phóng to" aria-label="Phóng to"></button>
    </div>
    <div class="sep"></div>
    <button class="txt pri" id="exp">Xuất</button>
    <button class="tb only-s" id="tgR" title="Thuộc tính" aria-label="Mở thuộc tính"></button>
  </header>
  <main>
    <aside id="left"></aside>
    <div id="stage">
      <div id="cv">
        <svg id="cvs" xmlns="http://www.w3.org/2000/svg">
          <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--dot)"/></pattern></defs>
          <rect id="dotrect" width="100%" height="100%" fill="url(#dots)"/>
        </svg>
        <div id="world"></div>
        <svg id="ovs" xmlns="http://www.w3.org/2000/svg"><g id="ov"></g></svg>
      </div>
      <div id="te" hidden contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="Sửa văn bản"></div>

/* ---------- văn bản ---------- */
const mctx=document.createElement('canvas').getContext('2d');

function runFont(o,r){

const _tlCache=new Map();
function textLinesOf(o,maxW){
  // nhớ đệm phép đo chữ: cùng nội dung + phông + bề rộng thì kết quả như nhau
  const ck=JSON.stringify([runsOf(o),o.fs,o.fw,o.ff,o.it,o.ls,o.tc,maxW]);
  const hitC=_tlCache.get(ck);if(hitC)return hitC;
  const res=textLinesRaw(o,maxW);
  if(_tlCache.size>6000)_tlCache.clear();
  _tlCache.set(ck,res);
  return res;
}
function textLinesRaw(o,maxW){
  const lines=[];
  let cur={segs:[],w:0};
  const push=()=>{lines.push(cur);cur={segs:[],w:0}};
  const trimEnd=l=>{while(l.segs.length&&/^\s+$/.test(l.segs[l.segs.length-1].t)){l.w-=l.segs.pop().w}};
  const meas=(t,r)=>{mctx.font=runFont(o,r);return mctx.measureText(t).width+(o.ls||0)*t.length};
  runsOf(o).forEach(r=>{
    caseTx(o,r.t).split('\n').forEach((part,pi)=>{
      if(pi>0){trimEnd(cur);push()}
      part.split(/(\s+)/).filter(x=>x!=='').forEach(tok=>{
        const sp=/^\s+$/.test(tok);
        let w=meas(tok,r);
        if(maxW!=null&&cur.segs.length&&cur.w+w>maxW){
          if(sp){trimEnd(cur);push();return}
          trimEnd(cur);push();
        }
        if(maxW!=null&&!sp&&w>maxW&&tok.length>1){
          let rest=tok;
          while(rest.length>1&&meas(rest,r)>maxW){
            let k=rest.length-1;
            while(k>1&&meas(rest.slice(0,k),r)>maxW)k--;
            const piece=rest.slice(0,k);
            cur.segs.push({t:piece,r,w:meas(piece,r)});cur.w+=meas(piece,r);push();
            rest=rest.slice(k);
          }
          tok=rest;w=meas(tok,r);
        }
        cur.segs.push({t:tok,r,w});cur.w+=w;
      });
    });
  });
  trimEnd(cur);push();
  return lines;
}
const lineH=o=>o.fs*(o.lh||1.3);

  const auto=o.tm==='auto';
  const lines=textLinesOf(o,auto?null:Math.max(4,o.w));
  if(auto){

    if(o._fit){if(o.ta==='right')o.x=rEdge-o.w;else if(o.ta==='center')o.x=cEdge-o.w/2}
  }
  if(o.tm!=='fixed')o.h=Math.max(Math.ceil(lineH(o)),Math.ceil(lines.length*lineH(o)));

/* ---------- hình học ---------- */
const rad=d=>d*Math.PI/180;

  const r=rad(deg),cs=Math.cos(r),sn=Math.sin(r),dx=p.x-c.x,dy=p.y-c.y;

}

  const c=ctrOf(o),h=o.w/2,v=o.h/2;

  if(!o.rot)return {x:o.x,y:o.y,w:o.w,h:o.h};

}

const union=list=>{
  let x1=1/0,y1=1/0,x2=-1/0,y2=-1/0;
  list.forEach(o=>{const b=aabb(o);x1=Math.min(x1,b.x);y1=Math.min(y1,b.y);x2=Math.max(x2,b.x+b.w);y2=Math.max(y2,b.y+b.h)});

};

  const ids=new Set(list.map(o=>o.id));

}

  const l=byId(id);if(l)return l;
  for(const p of doc.pages){if(p===curPage())continue;const f=p.objs.find(o=>o.id===id);if(f)return f}
  return null;
}
function subtree(m){
  const ids=new Set([m.id]),out=[];
  pageObjsOf(m).forEach(o=>{if(o.parent&&ids.has(o.parent)){ids.add(o.id);out.push(o)}});
  return out;
}
function topsOf(list){
  const ids=new Set(list.map(o=>o.id));
  return list.filter(o=>{
    let p=o.parent,n=0;
    while(p&&n++<60){if(ids.has(p))return false;const q=byId(p);p=q&&q.parent}
    return true;
  });
}

/* hình dạng dưới dạng đường SVG, toạ độ tuyệt đối chưa xoay */
function radii(o){
  const m=Math.min(o.w,o.h)/2;
  const a=(o.rr&&o.rr.length===4)?o.rr:[o.r,o.r,o.r,o.r];
  return a.map(v=>clamp(+v||0,0,m));
}
function rrD(x,y,w,h,r){
  const [a,b,c,d]=r.map(r2);
  if(!a&&!b&&!c&&!d)return `M${r2(x)} ${r2(y)}H${r2(x+w)}V${r2(y+h)}H${r2(x)}Z`;
  return `M${r2(x+a)} ${r2(y)}H${r2(x+w-b)}${b?`A${b} ${b} 0 0 1 ${r2(x+w)} ${r2(y+b)}`:''}V${r2(y+h-c)}${c?`A${c} ${c} 0 0 1 ${r2(x+w-c)} ${r2(y+h)}`:''}H${r2(x+d)}${d?`A${d} ${d} 0 0 1 ${r2(x)} ${r2(y+h-d)}`:''}V${r2(y+a)}${a?`A${a} ${a} 0 0 1 ${r2(x+a)} ${r2(y)}`:''}Z`;
}
function polyPts(o){
  const cx=o.x+o.w/2,cy=o.y+o.h/2,rx=o.w/2,ry=o.h/2,n=Math.max(3,o.n|0),pts=[];
  if(o.type==='star'){
    for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,k=i%2?o.ir:1;pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}
  }else for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;pts.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}
  return pts;
}
function lineEnds(o){
  return o.flip?[[o.x,o.y+o.h],[o.x+o.w,o.y]]:[[o.x,o.y],[o.x+o.w,o.y+o.h]];
}
function pathD(o){
  const sx=o.pw?o.w/o.pw:1,sy=o.ph?o.h/o.ph:1;
  let d='';
  (o.pc||[]).forEach(c=>{
    const n=c.n;if(!n.length)return;
    const X=v=>r2(o.x+v*sx),Y=v=>r2(o.y+v*sy);
    d+=`M${X(n[0].x)} ${Y(n[0].y)}`;
    const seg=(a,b)=>(!a.ox&&!a.oy&&!b.ix&&!b.iy)?`L${X(b.x)} ${Y(b.y)}`:`C${X(a.x+a.ox)} ${Y(a.y+a.oy)} ${X(b.x+b.ix)} ${Y(b.y+b.iy)} ${X(b.x)} ${Y(b.y)}`;
    for(let i=1;i<n.length;i++)d+=seg(n[i-1],n[i]);
    if(c.c&&n.length>1)d+=seg(n[n.length-1],n[0])+'Z';
  });
  return d;
}
function shapeD(o){
  switch(o.type){
    case 'rect':case 'frame':case 'image':case 'inst':case 'text':return rrD(o.x,o.y,o.w,o.h,radii(o));
    case 'ellipse':{
      const cx=o.x+o.w/2,cy=o.y+o.h/2,rx=o.w/2,ry=o.h/2;
      return `M${r2(cx-rx)} ${r2(cy)}A${r2(rx)} ${r2(ry)} 0 1 0 ${r2(cx+rx)} ${r2(cy)}A${r2(rx)} ${r2(ry)} 0 1 0 ${r2(cx-rx)} ${r2(cy)}Z`;
    }
    case 'polygon':case 'star':return 'M'+polyPts(o).map(p=>p.map(r2).join(' ')).join('L')+'Z';
    case 'line':case 'arrow':{const e=lineEnds(o);return `M${r2(e[0][0])} ${r2(e[0][1])}L${r2(e[1][0])} ${r2(e[1][1])}`}
    case 'path':return pathD(o);
  }
  return '';
}
const isOpenShape=o=>isLineLike(o)||(o.type==='path'&&(o.pc||[]).some(c=>!c.c));

/* hộp bao của đường vector theo toạ độ cục bộ (đơn vị cục bộ) */
function bezSamples(a,b,steps){
  const out=[];
  if(!a.ox&&!a.oy&&!b.ix&&!b.iy){out.push([b.x,b.y]);return out}
  const p0=[a.x,a.y],p1=[a.x+a.ox,a.y+a.oy],p2=[b.x+b.ix,b.y+b.iy],p3=[b.x,b.y];
  for(let i=1;i<=steps;i++){
    const t=i/steps,u=1-t;
    out.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]);
  }
  return out;
}
function contoursBBox(pc){
  let x1=1/0,y1=1/0,x2=-1/0,y2=-1/0;
  const add=p=>{x1=Math.min(x1,p[0]);y1=Math.min(y1,p[1]);x2=Math.max(x2,p[0]);y2=Math.max(y2,p[1])};
  pc.forEach(c=>{
    const n=c.n;
    n.forEach(q=>add([q.x,q.y]));
    for(let i=1;i<n.length;i++)bezSamples(n[i-1],n[i],14).forEach(add);
    if(c.c&&n.length>1)bezSamples(n[n.length-1],n[0],14).forEach(add);
  });
  if(!isFinite(x1))return {x:0,y:0,w:0,h:0};
  return {x:x1,y:y1,w:x2-x1,h:y2-y1};
}
/* đặt lại hộp bao của path theo các nút; giữ nguyên vị trí hiển thị kể cả khi đang xoay */
function renormPath(o){
  const sx=o.pw?o.w/o.pw:1,sy=o.ph?o.h/o.ph:1;
  const A=(o.pc||[]).map(c=>({c:c.c,n:c.n.map(q=>({...q,x:o.x+q.x*sx,y:o.y+q.y*sy,ix:q.ix*sx,iy:q.iy*sy,ox:q.ox*sx,oy:q.oy*sy}))}));
  const bb=contoursBBox(A);
  const oc=ctrOf(o),nc={x:bb.x+bb.w/2,y:bb.y+bb.h/2};
  const wc=o.rot?{x:oc.x+(rotAbout(nc,oc,o.rot).x-nc.x),y:oc.y+(rotAbout(nc,oc,o.rot).y-nc.y)}:nc;
  const sh={x:wc.x-nc.x,y:wc.y-nc.y};
  o.x=bb.x+sh.x;o.y=bb.y+sh.y;o.w=bb.w;o.h=bb.h;o.pw=bb.w;o.ph=bb.h;
  o.pc=A.map(c=>({c:c.c,n:c.n.map(q=>({x:q.x+sh.x-o.x,y:q.y+sh.y-o.y,ix:q.ix,iy:q.iy,ox:q.ox,oy:q.oy,sm:q.sm}))}));
}
function makePathObj(contoursAbs,props){
  const bb=contoursBBox(contoursAbs);
  const o=mk('path',{...props,x:bb.x,y:bb.y,w:bb.w,h:bb.h,pw:bb.w,ph:bb.h});
  o.pc=contoursAbs.map(c=>({c:c.c,n:c.n.map(q=>({x:q.x-bb.x,y:q.y-bb.y,ix:q.ix||0,iy:q.iy||0,ox:q.ox||0,oy:q.oy||0,sm:!!q.sm}))}));
  return o;
}
/* các đường bao (có tay cầm) của một hình bất kỳ, toạ độ thế giới, đã áp dụng xoay */
const KAPPA=0.5523;
function shapeContours(o){
  const c=ctrOf(o);
  const rot=p=>o.rot?rotAbout(p,c,o.rot):p;
  const rv=(dx,dy)=>{if(!o.rot)return [dx,dy];const r=rad(o.rot),cs=Math.cos(r),sn=Math.sin(r);return [dx*cs-dy*sn,dx*sn+dy*cs]};
  const N=(x,y,ix,iy,ox,oy)=>{const p=rot({x,y}),i=rv(ix||0,iy||0),q=rv(ox||0,oy||0);return {x:p.x,y:p.y,ix:i[0],iy:i[1],ox:q[0],oy:q[1],sm:false}};
  switch(o.type){
    case 'rect':case 'frame':case 'image':case 'inst':case 'text':{
      const [a,b,cc,d]=radii(o),x=o.x,y=o.y,w=o.w,h=o.h,K=KAPPA;
      if(!a&&!b&&!cc&&!d)return [{c:true,n:[N(x,y),N(x+w,y),N(x+w,y+h),N(x,y+h)]}];
      return [{c:true,n:[
        N(x+a,y,-a*K,0,0,0),N(x+w-b,y,0,0,b*K,0),
        N(x+w,y+b,0,-b*K,0,0),N(x+w,y+h-cc,0,0,0,cc*K),
        N(x+w-cc,y+h,cc*K,0,0,0),N(x+d,y+h,0,0,-d*K,0),
        N(x,y+h-d,0,d*K,0,0),N(x,y+a,0,0,0,-a*K)]}];
    }
    case 'ellipse':{
      const cx=o.x+o.w/2,cy=o.y+o.h/2,rx=o.w/2,ry=o.h/2;
      return [{c:true,n:[N(cx,cy-ry,-rx*KAPPA,0,rx*KAPPA,0),N(cx+rx,cy,0,-ry*KAPPA,0,ry*KAPPA),N(cx,cy+ry,rx*KAPPA,0,-rx*KAPPA,0),N(cx-rx,cy,0,ry*KAPPA,0,-ry*KAPPA)]}];
    }
    case 'polygon':case 'star':return [{c:true,n:polyPts(o).map(p=>N(p[0],p[1]))}];
    case 'line':case 'arrow':{const e=lineEnds(o);return [{c:false,n:[N(e[0][0],e[0][1]),N(e[1][0],e[1][1])]}]}
    case 'path':{
      const sx=o.pw?o.w/o.pw:1,sy=o.ph?o.h/o.ph:1;
      return (o.pc||[]).map(cn=>({c:cn.c,n:cn.n.map(q=>{
        const p=rot({x:o.x+q.x*sx,y:o.y+q.y*sy}),i=rv(q.ix*sx,q.iy*sy),oo=rv(q.ox*sx,q.oy*sy);
        return {x:p.x,y:p.y,ix:i[0],iy:i[1],ox:oo[0],oy:oo[1],sm:q.sm};
      })}));
    }
  }
  return [];
}

/* kiểm tra chạm bằng Path2D */
const hctx=document.createElement('canvas').getContext('2d');
function hitShape(o,p,tol){
  const q=toLocal(o,p);
  if(o.type==='path'||o.type==='polygon'||o.type==='star'||(o.type==='rect'&&radii(o).some(v=>v))||o.type==='frame'&&radii(o).some(v=>v)){
    let path;try{path=new Path2D(shapeD(o))}catch(e){return false}
    if(hctx.isPointInPath(path,q.x,q.y,o.type==='path'?'evenodd':'nonzero'))return true;
    if(o.stroke||isOpenShape(o)||o.type==='path'){hctx.lineWidth=Math.max(tol*2,(o.sw||1)+tol);return hctx.isPointInStroke(path,q.x,q.y)}
    return false;
  }
  if(isLineLike(o)){
    const e=lineEnds(o),a={x:e[0][0],y:e[0][1]},b={x:e[1][0],y:e[1][1]};
    const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;
    let t=l2?((q.x-a.x)*dx+(q.y-a.y)*dy)/l2:0;t=clamp(t,0,1);
    return Math.hypot(q.x-(a.x+t*dx),q.y-(a.y+t*dy))<=Math.max(tol,o.sw/2+2/Math.max(.01,view.z));
  }
  if(o.type==='ellipse'){
    const c=ctrOf(o),rx=o.w/2||1,ry=o.h/2||1;
    return ((q.x-c.x)/rx)**2+((q.y-c.y)/ry)**2<=1;
  }
  return q.x>=o.x&&q.x<=o.x+o.w&&q.y>=o.y&&q.y<=o.y+o.h;
}

/* ---------- lịch sử, trang, lưu ---------- */
const jrep=(k,v)=>k[0]==='_'?undefined:v;
const snap=()=>JSON.stringify({o:objs,s:doc.styles,v:doc.vars},jrep);
function syncHist(){$('#undo').disabled=!undoS.length;$('#redo').disabled=!redoS.length}
function pushHistory(){undoS.push(snap());if(undoS.length>100)undoS.shift();redoS=[];syncHist()}
function restore(s){
  const d=JSON.parse(s);
  objs=d.o.map(normalizeObj);doc.styles=d.s;if(d.v)doc.vars=d.v;
  sel=new Set([...sel].filter(id=>byId(id)));
  if(editing){editing=null;te.hidden=true}
  vedit=null;pen=null;
  render();
}
function doUndo(){if(!undoS.length)return;redoS.push(snap());restore(undoS.pop());syncHist()}
function doRedo(){if(!redoS.length)return;undoS.push(snap());restore(redoS.pop());syncHist()}
const curPage=()=>doc.pages[doc.cur];
function newPage(name){return {id:uid(),name,objs:[],guides:[],view:{x:0,y:0,z:1},start:null,undo:[],redo:[]}}
function syncPageOut(){const p=curPage();if(!p)return;p.objs=objs;p.guides=guides;p.view=view;p.undo=undoS;p.redo=redoS}
function switchPage(i){
  if(i===doc.cur||!doc.pages[i])return;
  syncPageOut();
  endAllModes();
  doc.cur=i;const p=curPage();
  objs=p.objs;guides=p.guides;view=p.view;undoS=p.undo||[];redoS=p.redo||[];
  sel=new Set();syncHist();render();
  if(!p.objs.length)fitView();
}
function loadDoc(d){
  doc={pages:[],cur:0,styles:d.styles||{fill:{},text:{}},images:d.images||{},vars:(d.vars&&d.vars.cols)?d.vars:{cols:[]}};
  if(!doc.styles.fill)doc.styles.fill={};
  if(!doc.styles.text)doc.styles.text={};
  (d.pages||[]).forEach(p=>{
    const pg=newPage(p.name||'Trang');
    pg.id=p.id||pg.id;pg.objs=(p.objs||[]).map(normalizeObj);pg.guides=p.guides||[];pg.view=p.view||pg.view;pg.start=p.start||null;
    doc.pages.push(pg);
  });
  if(!doc.pages.length)doc.pages.push(newPage('Trang 1'));
  doc.cur=clamp(d.cur|0,0,doc.pages.length-1);
  const p=curPage();
  objs=p.objs;guides=p.guides;view=p.view;undoS=[];redoS=[];
  p.undo=undoS;p.redo=redoS;
  sel=new Set();
}

/* ---------- lưu trữ bền: IndexedDB, ảnh riêng, phiên bản ---------- */
const IDB={db:null};
function idbOpen(){
  return new Promise(res=>{
    try{
      const r=indexedDB.open('xuong-ve',1);
      r.onupgradeneeded=()=>{r.result.createObjectStore('kv')};
      r.onsuccess=()=>{IDB.db=r.result;res(true)};
      r.onerror=()=>res(false);r.onblocked=()=>res(false);
    }catch(e){res(false)}
  });
}
const idbGet=k=>new Promise(res=>{
  if(!IDB.db)return res(undefined);
  try{const q=IDB.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}
});
const idbSet=(k,v)=>new Promise(res=>{
  if(!IDB.db)return res(false);
  try{const t=IDB.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}
});
const idbDel=k=>new Promise(res=>{
  if(!IDB.db)return res(false);
  try{const t=IDB.db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}
});
const savedImgs=new Set();
let saveT=0,saveWarned=false,lastSnapT=0,lastSnapBlob='';
function pagesData(){return doc.pages.map(p=>({id:p.id,name:p.name,objs:p.objs,guides:p.guides,view:p.view,start:p.start}))}
function docBlob(withImages){
  syncPageOut();
  const d={v:2,cur:doc.cur,styles:doc.styles,vars:doc.vars,pages:pagesData()};
  if(withImages)d.images=doc.images;
  return JSON.stringify(d,jrep);
}
function setSaveState(t){const el=$('#savest');if(el)el.textContent=t}
function save(){
  clearTimeout(saveT);
  setSaveState('Đang lưu…');
  saveT=setTimeout(async()=>{
    const blob=docBlob(false);
    if(IDB.db){
      for(const id of Object.keys(doc.images)){
        if(!savedImgs.has(id)&&await idbSet('im:'+id,doc.images[id]))savedImgs.add(id);
      }
      if(await idbSet('doc',blob)){
        setSaveState('Đã lưu trong trình duyệt');
        if(Date.now()-lastSnapT>240000&&blob!==lastSnapBlob){lastSnapT=Date.now();lastSnapBlob=blob;addVersion('Tự động',blob)}
        return;
      }
    }
    try{localStorage.setItem(LS_KEY,docBlob(true));setSaveState('Đã lưu (bộ nhớ nhỏ)')}
    catch(e){
      setSaveState('Chưa lưu được');
      if(!saveWarned){saveWarned=true;toast('Không lưu tự động được (bộ nhớ trình duyệt đầy). Hãy dùng Tệp > Sao chép JSON để lưu lại.')}
    }
  },500);
}
async function addVersion(label,blob){
  if(!IDB.db)return false;
  const arr=(await idbGet('versions'))||[];
  arr.unshift({t:Date.now(),label:label||'',data:blob||docBlob(false)});
  arr.length=Math.min(arr.length,15);
  return idbSet('versions',arr);
}
async function loadImagesFor(){
  if(!IDB.db)return;
  const need=new Set();
  doc.pages.forEach(p=>(p===curPage()?objs:p.objs).forEach(o=>{if(o.src&&!doc.images[o.src])need.add(o.src)}));
  for(const id of need){
    const v=await idbGet('im:'+id);
    if(v){doc.images[id]=v;savedImgs.add(id)}
  }
}
async function openVersions(){
  const arr=(await idbGet('versions'))||[];
  const fmt=t=>new Date(t).toLocaleString('vi-VN');
  let h=`<div class="crow2"><label class="fld" style="width:280px"><input type="text" id="vlabel" placeholder="Tên phiên bản, ví dụ Bản gửi sếp" aria-label="Tên phiên bản"></label><button class="txt pri" id="vsave">Lưu phiên bản ngay</button><span id="vmsg" style="color:var(--muted);font-size:12px"></span></div>`;
  h+='<p style="margin:0;color:var(--muted);font-size:12px">Trình duyệt tự lưu một phiên bản mỗi vài phút khi bạn chỉnh sửa, giữ tối đa 15 bản gần nhất. Khôi phục không làm mất bản hiện tại, vì nó được lưu thành một phiên bản trước.</p>';
  if(!IDB.db)h+='<p class="note">Trình duyệt này không cho dùng IndexedDB nên chưa có lịch sử phiên bản.</p>';
  h+='<div style="display:flex;flex-direction:column;gap:6px">';
  if(!arr.length&&IDB.db)h+='<p style="color:var(--muted)">Chưa có phiên bản nào.</p>';
  arr.forEach((v,i)=>{
    let pages='',n=0;
    try{const d=JSON.parse(v.data);pages=d.pages.length+' trang';n=d.pages.reduce((t,p)=>t+(p.objs||[]).length,0)}catch(e){}
    h+=`<div class="row" style="height:38px;margin:0"><span class="nm"><b>${esc(v.label||'Phiên bản')}</b> · ${fmt(v.t)} · ${pages}, ${n} đối tượng</span><button class="btn" style="height:28px" data-vrest="${i}">Khôi phục</button><button class="mini" style="width:28px;height:28px" data-vdel="${i}" title="Xoá phiên bản" aria-label="Xoá phiên bản">${ic('x',13)}</button></div>`;
  });
  h+='</div>';
  openModal('Phiên bản đã lưu',h,true);
}
async function restoreVersion(i){
  const arr=(await idbGet('versions'))||[];
  const v=arr[i];if(!v)return;
  await addVersion('Trước khi khôi phục',docBlob(false));
  endAllModes();
  const keep=doc.images;
  loadDoc(JSON.parse(v.data));
  Object.assign(doc.images,keep);
  await loadImagesFor();
  closeModal();syncHist();render();fitView();
  toast('Đã khôi phục phiên bản "'+(v.label||'Phiên bản')+'".');
}

/* ---------- thứ tự, cha con, auto layout, ràng buộc, component ---------- */
const EMPTY=new Set();
function cloneObj(o){const c=JSON.parse(JSON.stringify(o,jrep));c.id=uid();return c}
function cloneSet(src,offx,offy){
  const map={};
  const cl=src.map(o=>{const c=cloneObj(o);map[o.id]=c.id;return c});
  const dy=offy==null?offx:offy;
  cl.forEach(c=>{c.x+=offx;c.y+=dy;if(c.parent&&map[c.parent])c.parent=map[c.parent]});
  return cl;
}
function kidsOf(m){
  const seen={};
  return subtree(m).map(c=>{
    const base=c.name||c.type;seen[base]=(seen[base]||0)+1;
    return {c,key:base+(seen[base]>1?'#'+seen[base]:'')};
  });
}
const hasLay=m=>!!(m.lay||subtree(m).some(c=>c.type==='frame'&&c.lay));
const hugInst=c=>{const m=c.type==='inst'&&refMaster(c.ref);return !!(m&&m.lay&&m.lay.hug)};

function fixOrder(){
  const ids=new Set(objs.map(o=>o.id)),kids=new Map();
  // con của instance chỉ hợp lệ khi nằm trong một khe (slot) còn tồn tại; nếu không, trả về khung chứa instance
  const byIdM=new Map(objs.map(o=>[o.id,o]));
  objs.forEach(o=>{
    const p=o.parent&&byIdM.get(o.parent);
    if(p&&p.type==='inst'){
      const m=refMaster(p.ref);
      const ok=m&&o.slot&&(m.cprops||[]).some(q=>q.id===o.slot&&q.type==='slot')&&subtree(m).some(c=>c.cp&&c.cp.slot===o.slot);
      if(!ok){o.parent=p.parent||null;o.slot=null}
    }else if(o.slot&&!(p&&p.type==='inst'))o.slot=null;
  });
  objs.forEach(o=>{
    if(o.parent&&!ids.has(o.parent))o.parent=null;
    if(o.parent){if(!kids.has(o.parent))kids.set(o.parent,[]);kids.get(o.parent).push(o)}
  });
  const out=[],seen=new Set();
  const emit=o=>{if(seen.has(o.id))return;seen.add(o.id);out.push(o);(kids.get(o.id)||[]).forEach(emit)};
  objs.forEach(o=>{if(!o.parent)emit(o)});
  objs.forEach(o=>{if(!seen.has(o.id)){o.parent=null;emit(o)}});
  objs=out;
}
function assignParent(o){
  if(o.sec){o.parent=null;return}
  const cx=o.x+o.w/2,cy=o.y+o.h/2;
  const ban=new Set([o.id]);
  if(o.type==='frame')subtree(o).forEach(c=>ban.add(c.id));
  if(o.type==='inst'){const m=refMaster(o.ref);if(m){ban.add(m.id);subtree(m).forEach(c=>ban.add(c.id))}}
  let f=null;
  o.slot=null;
  for(let i=objs.length-1;i>=0;i--){
    const c=objs[i];
    if(c.type==='inst'&&!ban.has(c.id)&&!c.hidden&&!c.locked&&!o.comp){
      const hitS=slotRects(c).find(r=>cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h);
      if(hitS){o.parent=c.id;o.slot=hitS.pid;return}
    }
    if(c.type==='frame'&&!ban.has(c.id)&&!c.hidden&&!c.locked){
      const b=aabb(c);
      if(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h){f=c;break}
    }
  }
  o.parent=f?f.id:null;
}

/* ---- auto layout ---- */
function flow(fr,kids){
  const L=fr.lay,vert=L.dir==='v';
  const pH=L.px!=null?L.px:(L.pad||0),pV=L.py!=null?L.py:(L.pad||0);
  const padM=vert?pV:pH,padC=vert?pH:pV,gap=L.gap||0;
  const list=kids.filter(c=>!c.hidden&&!c.abs);
  const Mz=c=>vert?c.h:c.w,Xz=c=>vert?c.w:c.h;
  const isFill=c=>c.lf==='fill'&&c.type!=='text'&&!hugInst(c)&&!(c.type==='frame'&&c.lay&&c.lay.hug);
  if(L.wrap&&!vert&&!L.hug){
    const avail=fr.w-2*padM;
    const rows=[];let row=[],rw=0;
    list.forEach(c=>{
      if(row.length&&rw+gap+c.w>avail){rows.push({it:row,w:rw});row=[];rw=0}
      rw+=(row.length?gap:0)+c.w;row.push(c);
    });
    if(row.length)rows.push({it:row,w:rw});
    let y=padC;
    rows.forEach(r=>{
      const rh=Math.max(0,...r.it.map(c=>c.h)),sumW=r.it.reduce((t,c)=>t+c.w,0);
      let g=gap,x=padM;
      if(L.mj==='center')x+=(avail-r.w)/2;else if(L.mj==='end')x+=avail-r.w;
      else if(L.mj==='between'&&r.it.length>1)g=(avail-sumW)/(r.it.length-1);
      r.it.forEach(c=>{
        const off=L.alg==='center'?(rh-c.h)/2:L.alg==='end'?rh-c.h:0;
        c.x=fr.x+x;c.y=fr.y+y+off;x+=c.w+g;
      });
      y+=rh+gap;
    });
    return {w:fr.w,h:rows.length?y-gap+padC:fr.h};
  }
  const base=(vert?fr.w:fr.h)-2*padC;
  let cross=base;
  if(L.hug&&list.length){
    cross=0;list.forEach(c=>{if(!isFill(c))cross=Math.max(cross,Xz(c))});
    if(!cross)cross=base;
  }
  list.forEach(c=>{if(isFill(c)){if(vert)c.w=cross;else c.h=cross}});
  const sumM=list.reduce((t,c)=>t+Mz(c),0);
  const total=sumM+gap*Math.max(0,list.length-1);
  const out={w:fr.w,h:fr.h};
  if(L.hug&&list.length){
    if(vert){out.h=total+2*padM;out.w=cross+2*padC}else{out.w=total+2*padM;out.h=cross+2*padC}
  }
  const room=(vert?out.h:out.w)-2*padM;
  let g=gap,start=0;
  if(!L.hug){
    if(L.mj==='between'&&list.length>1)g=(room-sumM)/(list.length-1);
    else if(L.mj==='center')start=(room-total)/2;
    else if(L.mj==='end')start=room-total;
  }
  let cur=padM+start;
  list.forEach(c=>{
    const cs=Xz(c),off=L.alg==='center'?(cross-cs)/2:L.alg==='end'?cross-cs:0;
    if(vert){c.x=fr.x+padC+off;c.y=fr.y+cur}else{c.x=fr.x+cur;c.y=fr.y+padC+off}
    cur+=Mz(c)+g;
  });
  return out;
}
function layoutPass(list,skip){
  if(!list.some(f=>f.type==='frame'&&f.lay))return;
  const kmap=new Map();
  list.forEach(c=>{if(c.parent){if(!kmap.has(c.parent))kmap.set(c.parent,[]);kmap.get(c.parent).push(c)}});
  const desc=id=>{
    const out=[],st=[...(kmap.get(id)||[])];
    while(st.length){const c=st.pop();out.push(c);(kmap.get(c.id)||[]).forEach(x=>st.push(x))}
    return out;
  };
  for(let p=0;p<2;p++){
    for(let i=list.length-1;i>=0;i--){
      const f=list[i];
      if(f.type!=='frame'||!f.lay)continue;
      // phần tử đang kéo vẫn giữ chỗ trong dòng chảy để khung không co lại giữa chừng
      const kids=kmap.get(f.id)||[];
      const before=kids.map(c=>[c.x,c.y]);
      const r=flow(f,kids);f.w=r.w;f.h=r.h;
      kids.forEach((c,j)=>{
        if(skip&&skip.has(c.id)){c.x=before[j][0];c.y=before[j][1];return}
        const dx=c.x-before[j][0],dy=c.y-before[j][1];
        if((dx||dy)&&c.type==='frame')desc(c.id).forEach(d=>{d.x+=dx;d.y+=dy});
      });
    }
  }
}
function syncInst(o){
  const m=refMaster(o.ref);
  if(!m||!m.lay||!m.lay.hug)return;
  const r=instLayout(o);o.w=r.w;o.h=r.h;
}
function relayoutAll(){
  if(!objs.some(o=>o.lay))return;
  const skip=drag&&drag.type==='move'?new Set(drag.items.map(i=>i.o.id)):EMPTY;
  for(let p=0;p<2;p++){
    objs.forEach(o=>{if(o.type==='inst')syncInst(o)});
    layoutPass(objs,skip);
  }
}
function reorderKids(f){
  const L=f.lay;if(!L)return;
  const kids=objs.filter(c=>c.parent===f.id&&!c.abs);
  const slots=kids.map(c=>objs.indexOf(c)).sort((a,b)=>a-b);
  const key=c=>L.dir==='v'?c.y+c.h/2:c.x+c.w/2;
  [...kids].sort((a,b)=>key(a)-key(b)).forEach((c,i)=>{objs[slots[i]]=c});
}
function settleParents(list){
  const fs=new Set();
  topsOf(list).forEach(o=>{assignParent(o);if(o.parent)fs.add(o.parent)});
  fs.forEach(id=>{const f=byId(id);if(f&&f.lay)reorderKids(f)});
}
function wrapFrame(S,props){
  const T=topsOf(S),B=union(T);
  const P=T.every(o=>o.parent===T[0].parent)?T[0].parent:null;
  const f=mk('frame',{x:B.x,y:B.y,w:Math.max(1,B.w),h:Math.max(1,B.h),fill:'',parent:P,...props});
  objs.splice(Math.min(...T.map(o=>objs.indexOf(o))),0,f);
  T.forEach(c=>{c.parent=f.id});
  return f;
}
function enableLayout(f,wrapped){
  const kids=objs.filter(c=>c.parent===f.id);
  const B=kids.length?union(kids):null;
  f.lay={dir:B&&B.w>B.h*1.2?'h':'v',gap:12,pad:wrapped?12:16,px:null,py:null,alg:'start',mj:'start',hug:!!wrapped};
  reorderKids(f);
}
function addLayout(){
  const S=selObjs();if(!S.length){toast('Chọn một Frame hoặc vài đối tượng để thêm auto layout');return}
  pushHistory();
  if(S.length===1&&S[0].type==='frame'){
    if(!S[0].lay)enableLayout(S[0],false);
    render();return;
  }
  const f=wrapFrame(S,{name:'Auto layout '+(objs.filter(o=>o.lay).length+1)});
  enableLayout(f,true);
  sel=new Set([f.id]);render();
}

/* ---- ràng buộc khi đổi cỡ khung ---- */
const snapMap=list=>new Map(list.map(o=>[o.id,{x:o.x,y:o.y,w:o.w,h:o.h,fs:o.fs}]));
function constrainBox(c,c0,a,b){
  const cxm=c.cx||'l',cym=c.cy||'t';
  let x=c0.x,w=c0.w,y=c0.y,h=c0.h;
  const kx=a.w?b.w/a.w:1,ky=a.h?b.h/a.h:1;
  if(cxm==='l')x=b.x+(c0.x-a.x);
  else if(cxm==='r')x=b.x+b.w-((a.x+a.w)-(c0.x+c0.w))-c0.w;
  else if(cxm==='c')x=b.x+b.w/2+((c0.x+c0.w/2)-(a.x+a.w/2))-c0.w/2;
  else if(cxm==='lr'){x=b.x+(c0.x-a.x);w=Math.max(1,b.w-(c0.x-a.x)-((a.x+a.w)-(c0.x+c0.w)))}
  else{x=b.x+(c0.x-a.x)*kx;w=c0.w*kx}
  if(cym==='t')y=b.y+(c0.y-a.y);
  else if(cym==='b')y=b.y+b.h-((a.y+a.h)-(c0.y+c0.h))-c0.h;
  else if(cym==='c')y=b.y+b.h/2+((c0.y+c0.h/2)-(a.y+a.h/2))-c0.h/2;
  else if(cym==='tb'){y=b.y+(c0.y-a.y);h=Math.max(1,b.h-(c0.y-a.y)-((a.y+a.h)-(c0.y+c0.h)))}
  else{y=b.y+(c0.y-a.y)*ky;h=c0.h*ky}
  return {x,y,w,h};
}
function applyBox(o,nb,S0,list){
  const a=S0.get(o.id);
  o.x=nb.x;o.y=nb.y;
  if(o.type==='text'){
    if(Math.abs(nb.w-a.w)>1e-6){o.w=nb.w;if(o.tm==='auto')o.tm='height';fitText(o)}
    if(o.tm==='fixed'&&Math.abs(nb.h-a.h)>1e-6)o.h=nb.h;
  }else{o.w=nb.w;o.h=nb.h}
  const kids=list.filter(k=>k.parent===o.id);
  if(!kids.length)return;
  const resized=Math.abs(nb.w-a.w)>1e-6||Math.abs(nb.h-a.h)>1e-6;
  kids.forEach(k=>{
    const k0=S0.get(k.id);
    if(o.type==='frame'&&!o.lay&&resized)applyBox(k,constrainBox(k,k0,a,nb),S0,list);
    else applyBox(k,{x:k0.x+(nb.x-a.x),y:k0.y+(nb.y-a.y),w:k0.w,h:k0.h},S0,list);
  });
}

/* ---- component & instance ---- */
function instLayout(o){
  const m=refMaster(o.ref),ov=o.ov||{};
  const base=modesOf(o);
  const P=m.cprops||[];
  const pval=id=>{const p=P.find(q=>q.id===id);if(!p)return undefined;return o.props&&id in o.props?o.props[id]:p.def};
  const root={...m,x:0,y:0,hidden:false,rot:0,vm:null};
  const ks=kidsOf(m).map(({c,key})=>({k:{...c,x:c.x-m.x,y:c.y-m.y},key,c}));
  const list=[root,...ks.map(q=>q.k)];
  list.forEach(k=>{if(k.bind)bindApply(k,modesOf(k,list,base))});
  ks.forEach(({k,key,c})=>{
    const v=ov[key]||ov[c.id];
    if(v){Object.assign(k,v);if(v.text!==undefined){k.rt=null;fitText(k)}}
    if(k.cp){
      if(k.cp.vis){const x=pval(k.cp.vis);if(x!==undefined)k.hidden=!x}
      if(k.cp.text&&k.type==='text'){const x=pval(k.cp.text);if(x!==undefined){k.text=String(x);k.rt=null;fitText(k)}}
      if(k.cp.swap&&k.type==='inst'){const x=pval(k.cp.swap),nm=x&&refMaster(x);if(nm&&nm.id!==k.ref){k.ref=nm.id;k.w=nm.w;k.h=nm.h}}
    }
  });
  // khe nội dung (slot): thay nội dung mặc định bằng các lớp thật đặt vào bản sao
  const reals=[];
  const isReal=objs.indexOf(o)>=0;
  if(P.some(p=>p.type==='slot')){
    const own=objs.filter(c=>c.parent===o.id&&c.slot);
    ks.forEach(({k})=>{
      if(!k.cp||!k.cp.slot)return;
      const mine=own.filter(c=>c.slot===k.cp.slot);
      if(!mine.length)return;
      const drop=new Set([k.id]);
      list.forEach(x=>{if(x.parent&&drop.has(x.parent))drop.add(x.id)});
      drop.delete(k.id);
      for(let i=list.length-1;i>=0;i--)if(drop.has(list[i].id))list.splice(i,1);
      withChildren(mine).forEach(r=>{
        const cp={...r,x:r.x-o.x,y:r.y-o.y,_real:r};
        if(mine.includes(r)){cp.parent=k.id;cp.cx='l';cp.cy='t'}
        list.push(cp);reals.push(cp);
      });
    });
  }
  if(Math.abs(o.w-m.w)>1e-6||Math.abs(o.h-m.h)>1e-6){
    const S0=snapMap(list);
    applyBox(root,{x:0,y:0,w:o.w,h:o.h},S0,list);
  }
  const skip=drag&&drag.type==='move'?new Set(drag.items.map(i=>i.o.id)):null;
  layoutPass(list,skip);
  if(isReal)reals.forEach(c=>{if(!skip||!skip.has(c.id)){c._real.x=o.x+c.x;c._real.y=o.y+c.y;if(c._real.w!==c.w&&c.lf==='fill')c._real.w=c.w;if(c._real.h!==c.h&&c.lf==='fill')c._real.h=c.h}});
  return {w:root.w,h:root.h,list};
}
/* các vùng khe của một bản sao, toạ độ thế giới */
function slotRects(c){
  const m=refMaster(c.ref);
  if(!m||!(m.cprops||[]).some(p=>p.type==='slot'))return [];
  const r=instLayout(c);
  return r.list.filter(k=>k.cp&&k.cp.slot&&!k._real).map(k=>({pid:k.cp.slot,x:c.x+k.x,y:c.y+k.y,w:k.w,h:k.h}));
}
function addVariant(m){
  pushHistory();
  if(!m.set){m.set=uid();m.setName=m.name||'Component';m.vp={'Kiểu':'Mặc định'}}
  const mem=objs.filter(x=>x.comp&&x.set===m.set);
  const cl=cloneSet(withChildren([m]),0,0);
  const dx=Math.max(...mem.map(x=>x.x+x.w))+40-m.x;
  cl.forEach(c=>{c.x+=dx});
  cl[0].vp={...m.vp,[Object.keys(m.vp)[0]]:'Biến thể '+(mem.length+1)};
  cl.forEach(c=>objs.push(c));
  sel=new Set([cl[0].id]);render();
  toast('Đã thêm biến thể. Sửa nội dung riêng của nó rồi đặt tên giá trị ở bảng bên phải.');
}
function switchVariant(inst,prop,val){
  const m=refMaster(inst.ref);if(!m||!m.set)return;
  const want={...m.vp,[prop]:val};
  let best=null,bs=-1;
  pageObjsOf(m).filter(x=>x.comp&&x.set===m.set&&(x.vp||{})[prop]===val).forEach(x=>{
    let sc=0;Object.keys(want).forEach(k=>{if(k!==prop&&x.vp[k]===want[k])sc++});
    if(sc>bs){best=x;bs=sc}
  });
  if(!best||best===m)return;
  pushHistory();
  inst.ref=best.id;
  render();
}
function createInstance(m,pos){
  pushHistory();
  const o=mk('inst',{ref:m.id,x:pos.x,y:pos.y,w:m.w,h:m.h,fill:'',ov:{}});
  objs.push(o);settleParents([o]);
  sel=new Set([o.id]);render();
}
function detachInst(inst){
  const i=objs.indexOf(inst),m=refMaster(inst.ref);
  if(i<0)return [];
  if(!m){inst.type='rect';inst.fill='#D9D9D9';inst.ref=null;return [inst]}
  const full_=instLayout(inst).list;
  const realKids=full_.filter(k=>k._real);
  const list=full_.filter((k,j)=>!k._real&&(j===0||!k.hidden));
  const map={};list.forEach(k=>{map[k.id]=uid()});
  realKids.forEach(k=>{if(k._real.parent===inst.id){k._real.parent=map[k.parent]||null;k._real.slot=null}});
  const out=list.map((k,j)=>{
    const n=JSON.parse(JSON.stringify(k,jrep));
    n.id=map[k.id];n.x=inst.x+k.x;n.y=inst.y+k.y;
    n.comp=false;n.set=null;n.setName='';n.vp=null;n.cp=null;n.cprops=null;n.props=null;
    n.parent=j===0?inst.parent:(map[k.parent]||map[list[0].id]);
    if(j===0){n.slot=inst.slot;n.lf=inst.lf;n.abs=inst.abs;n.cx=inst.cx;n.cy=inst.cy;n.name=inst.name||m.name;n.op=inst.op;n.hidden=false;n.locked=false;n.rot=inst.rot||0;n.link=inst.link;n.vm=inst.vm}
    return n;
  });
  objs.splice(i,1,...out);
  return out;
}
function detachSel(){
  const S=selObjs().filter(o=>o.type==='inst');
  if(!S.length){toast('Chọn một bản sao (instance) để tách');return}
  pushHistory();
  const ns=new Set();
  S.forEach(o=>{const r=detachInst(o);if(r[0])ns.add(r[0].id)});
  sel=ns;render();
}
function makeComponent(){
  const S=selObjs();
  if(!S.length){toast('Chọn ít nhất một đối tượng');return}
  if(S.length===1&&S[0].type==='frame'){
    const f=S[0];
    if(f.comp){toast('Frame này đã là component');return}
    pushHistory();f.comp=true;render();
    toast('Đã tạo component. Dùng nút + ở bảng Component để thêm bản sao.');return;
  }
  pushHistory();
  const f=wrapFrame(S,{comp:true,name:'Component '+(objs.filter(o=>o.comp).length+1)});
  sel=new Set([f.id]);render();
  toast('Đã tạo component. Dùng nút + ở bảng Component để thêm bản sao.');
}

/* ---------- vẽ SVG ---------- */
function resolvedFill(o){
  const st=o.fsid&&doc.styles.fill[o.fsid];
  if(st)return {color:st.color||'',grad:st.grad||null};
  return {color:o.fill,grad:o.grad};
}
function gradDef(id,g){
  const stops=g.s.map(s=>`<stop offset="${r2(s[0]*100)}%" stop-color="${s[1]}"${s[2]!=null&&s[2]<1?` stop-opacity="${s[2]}"`:''}/>`).join('');
  if(g.t==='radial')return `<radialGradient id="${id}" cx="50%" cy="50%" r="50%">${stops}</radialGradient>`;
  const a=rad((g.a||0)-90),dx=Math.cos(a)/2,dy=Math.sin(a)/2;
  return `<linearGradient id="${id}" x1="${r2(.5-dx)}" y1="${r2(.5-dy)}" x2="${r2(.5+dx)}" y2="${r2(.5+dy)}">${stops}</linearGradient>`;
}
function rotAttr(o){return o.rot?` transform="rotate(${r2(o.rot)} ${r2(o.x+o.w/2)} ${r2(o.y+o.h/2)})"`:''}
function geomStr(o,at){
  const rt=rotAttr(o);
  if(o.type==='ellipse')return `<ellipse cx="${r2(o.x+o.w/2)}" cy="${r2(o.y+o.h/2)}" rx="${r2(o.w/2)}" ry="${r2(o.h/2)}"${at}${rt}/>`;
  if(isLineLike(o)){const e=lineEnds(o);return `<line x1="${r2(e[0][0])}" y1="${r2(e[0][1])}" x2="${r2(e[1][0])}" y2="${r2(e[1][1])}"${at}${rt}/>`}
  if(o.type==='rect'||o.type==='frame'||o.type==='image'||o.type==='inst'||o.type==='text'){
    const rr=radii(o);
    if(rr[0]===rr[1]&&rr[1]===rr[2]&&rr[2]===rr[3])return `<rect x="${r2(o.x)}" y="${r2(o.y)}" width="${r2(o.w)}" height="${r2(o.h)}"${rr[0]?` rx="${r2(rr[0])}"`:''}${at}${rt}/>`;
  }
  return `<path d="${shapeD(o)}"${at}${rt}/>`;
}
function strokeAttrs(o,w,ctx){

/* hình học lưới bố cục theo toạ độ cục bộ của khung (gốc ở góc trên trái) */
function gridGeom(f){
  const cols=[],rows=[],cells=[],xs=[],ys=[];
  (f.grids||[]).forEach(g=>{
    if(g.t==='cols'||g.t==='rows'){
      const len=g.t==='cols'?f.w:f.h,n=Math.max(1,g.n|0),cw=(len-2*g.m-(n-1)*g.g)/n;
      for(let i=0;i<n;i++){
        const a=g.m+i*(cw+g.g),b=a+cw;
        (g.t==='cols'?cols:rows).push({a,b,col:g.c,o:g.o});
        (g.t==='cols'?xs:ys).push(a,b);
      }
    }else cells.push({s:Math.max(2,g.s),col:g.c,o:g.o});
  });
  return {cols,rows,cells,xs,ys};
}
/* các đường bao của path đang sửa, toạ độ thế giới (có xoay) */

/* ---------- toạ độ, zoom, pan ---------- */
function toWorld(e){

}
function zoomAt(cx,cy,nz){
  nz=clamp(nz,.02,64);
  view.x=cx-(cx-view.x)*(nz/view.z);
  view.y=cy-(cy-view.y)*(nz/view.z);
  view.z=nz;

}
const stageSize=()=>{const r=stage.getBoundingClientRect();return {w:r.width,h:r.height}};
const stageCtr=()=>{const s=stageSize();return {x:s.w/2,y:s.h/2}};
function fitView(list){
  const L=(list&&list.length?list:objs.filter(o=>!o.hidden));
  const {w,h}=stageSize();
  if(!L.length){view.x=w/2;view.y=h/2;view.z=1;render({noLayers:true,noPanel:true});return}
  const B=union(L),pad=70;
  const z=Math.min(Math.max(.02,Math.min((w-pad*2)/Math.max(B.w,1),(h-pad*2)/Math.max(B.h,1))),2);
  view.z=z;view.x=(w-B.w*z)/2-B.x*z;view.y=(h-B.h*z)/2-B.y*z;
  render({noLayers:true,noPanel:true});
}
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey){
    zoomAt(e.clientX-r.left,e.clientY-r.top,view.z*Math.exp(-e.deltaY*.0105));
  }else{
    if(e.shiftKey&&!e.deltaX)view.x-=e.deltaY;else{view.x-=e.deltaX;view.y-=e.deltaY}
    render({noLayers:true,noPanel:true});
  }
},{passive:false});

/* ---------- hit test ---------- */
function hiddenIds(){
  const s=new Set();
  objs.forEach(o=>{if(o.hidden||(o.parent&&s.has(o.parent)))s.add(o.id)});
  return s;
}
function inClip(o,p){
  let q=o.parent,n=0;
  while(q&&n++<40){
    const f=byId(q);if(!f)break;
    if(f.type==='frame'&&f.clip!==false){
      const l=toLocal(f,p);
      if(l.x<f.x||l.x>f.x+f.w||l.y<f.y||l.y>f.y+f.h)return false;
    }
    q=f.parent;
  }
  return true;
}
function hit(p){
  const tol=6/view.z,hid=hiddenIds();
  for(let i=objs.length-1;i>=0;i--){
    const o=objs[i];
    if(hid.has(o.id)||o.locked||o.mask)continue;
    if(o.type==='frame'&&!o.parent&&!sel.has(o.id))continue;
    if(hitShape(o,p,tol)&&inClip(o,p))return o.id;
  }
  return null;
}

/* ---------- bắt dính & đường gióng ---------- */
function snapLines(excl){
  const xs=[],ys=[];
  const hid=hiddenIds();
  objs.forEach(o=>{
    if(excl.has(o.id)||hid.has(o.id))return;
    const b=aabb(o);
    [b.x,b.x+b.w/2,b.x+b.w].forEach(v=>xs.push({v,a:b.y,b:b.y+b.h}));
    [b.y,b.y+b.h/2,b.y+b.h].forEach(v=>ys.push({v,a:b.x,b:b.x+b.w}));
  });
  const par=new Set();
  objs.forEach(q=>{if(excl.has(q.id)&&q.parent)par.add(q.parent)});
  objs.forEach(f=>{
    if(f.type!=='frame'||!f.grids||!f.grids.length||f.rot||hid.has(f.id))return;
    if(!(f.gshow||par.has(f.id)||excl.has(f.id)&&false))return;
    const G=gridGeom(f);
    G.xs.forEach(v=>xs.push({v:f.x+v,a:f.y,b:f.y+f.h}));
    G.ys.forEach(v=>ys.push({v:f.y+v,a:f.x,b:f.x+f.w}));
  });
  guides.forEach(g=>{(g.a==='x'?xs:ys).push({v:g.p,a:-1e7,b:1e7})});
  return {xs,ys};
}
const snapActive=e=>snapOn&&!(e.ctrlKey||e.metaKey);
function snapBox(B,dx,dy,T){
  const thr=6/view.z;
  const best=(vals,lines)=>{let r=null;vals.forEach(m=>lines.forEach(t=>{const d=t.v-m;if(Math.abs(d)<=thr&&(!r||Math.abs(d)<Math.abs(r.d)))r={d,t}}));return r};
  const bx=best([B.x+dx,B.x+B.w/2+dx,B.x+B.w+dx],T.xs),by=best([B.y+dy,B.y+B.h/2+dy,B.y+B.h+dy],T.ys);
  const out={dx:dx+(bx?bx.d:0),dy:dy+(by?by.d:0),guides:[]};
  if(bx)out.guides.push({a:'x',p:bx.t.v,from:Math.min(B.y+out.dy,bx.t.a),to:Math.max(B.y+B.h+out.dy,bx.t.b)});
  if(by)out.guides.push({a:'y',p:by.t.v,from:Math.min(B.x+out.dx,by.t.a),to:Math.max(B.x+B.w+out.dx,by.t.b)});
  return out;
}
function snapPt(p,T){
  const thr=6/view.z;let bx=null,by=null;
  T.xs.forEach(t=>{const d=t.v-p.x;if(Math.abs(d)<=thr&&(!bx||Math.abs(d)<Math.abs(bx.d)))bx={d,t}});
  T.ys.forEach(t=>{const d=t.v-p.y;if(Math.abs(d)<=thr&&(!by||Math.abs(d)<Math.abs(by.d)))by={d,t}});
  const q={x:p.x+(bx?bx.d:0),y:p.y+(by?by.d:0),guides:[]};
  if(bx)q.guides.push({a:'x',p:bx.t.v,from:Math.min(q.y,bx.t.a),to:Math.max(q.y,bx.t.b)});
  if(by)q.guides.push({a:'y',p:by.t.v,from:Math.min(q.x,by.t.a),to:Math.max(q.x,by.t.b)});
  return q;
}
const allSnapT=()=>snapLines(EMPTY);

/* ---------- scale sâu (công cụ K) ---------- */
const deepSnap=list=>new Map(list.map(o=>[o.id,{x:o.x,y:o.y,w:o.w,h:o.h,fs:o.fs,sw:o.sw,r:o.r,rr:o.rr?[...o.rr]:null,lay:o.lay?{gap:o.lay.gap,pad:o.lay.pad,px:o.lay.px,py:o.lay.py}:null}]));
function deepScale(tops,B0,nb,S0){
  const kx=B0.w?nb.w/B0.w:1,ky=B0.h?nb.h/B0.h:1,ks=Math.sqrt(kx*ky);
  withChildren(tops).forEach(o=>{
    const a=S0.get(o.id);if(!a)return;
    o.x=nb.x+(a.x-B0.x)*kx;o.y=nb.y+(a.y-B0.y)*ky;
    o.w=Math.max(isLineLike(o)?0:1,a.w*kx);o.h=Math.max(isLineLike(o)?0:1,a.h*ky);
    o.sw=r2(a.sw*ks);
    if(o.rr)o.rr=a.rr.map(v=>r2(v*ks));else o.r=r2(a.r*ks);
    if(o.type==='text'){o.fs=Math.max(4,r1(a.fs*ky));fitText(o)}
    if(o.lay&&a.lay){
      o.lay.gap=r2(a.lay.gap*ks);o.lay.pad=r2(a.lay.pad*ks);
      if(a.lay.px!=null)o.lay.px=r2(a.lay.px*ks);if(a.lay.py!=null)o.lay.py=r2(a.lay.py*ks);
      o.lay.hug=false;
    }
  });
}

/* ---------- biến đổi nhóm (đổi cỡ nhiều đối tượng) ---------- */
function scaleGroup(tops,B0,nb,S0){
  const kx=B0.w?nb.w/B0.w:1,ky=B0.h?nb.h/B0.h:1;
  tops.forEach(o=>{
    const a=S0.get(o.id);
    const x=nb.x+(a.x-B0.x)*kx,y=nb.y+(a.y-B0.y)*ky;
    if(o.type==='text'){
      o.x=x;o.y=y;o.fs=Math.max(4,r1(a.fs*ky));fitText(o);
      return;
    }
    const min=isLineLike(o)?0:1;
    applyBox(o,{x,y,w:Math.max(min,a.w*kx),h:Math.max(min,a.h*ky)},S0,objs);
  });
}

function veditDown(e,p,ds){
  const o=byId(vedit.id);
  if(!o){vedit=null;return false}
  if(ds.vh){const [c,i,w]=ds.vh.split(':');drag={type:'vhandle',c:+c,i:+i,w,o,pushed:false};return true}
  if(ds.vn){
    const [c,i]=ds.vn.split(':').map(Number);
    vedit.sel={c,i};
    drag={type:'vnode',c,i,o,pushed:false,sxp:e.clientX,syp:e.clientY};
    render({noLayers:true});return true;
  }
  const h=nearestSegment(o,p);
  if(h&&h.dist<=7/view.z){
    pushHistory();insertNode(o,h);
    vedit.sel={c:h.c,i:h.i+1};
    drag={type:'vnode',c:h.c,i:h.i+1,o,pushed:true,sxp:e.clientX,syp:e.clientY};
    render({noLayers:true});return true;
  }
  exitVedit();
  return false;
}
function onDown(e){
  e.preventDefault();
  if(editing)te.blur();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){startPinch();return}
  if(pointers.size>2)return;
  hidePop();
  const p=toWorld(e),ds=(e.target&&e.target.dataset)||{};
  const now=performance.now();
  const isDbl=e.button===0&&lastDown&&now-lastDown.t<400&&Math.hypot(e.clientX-lastDown.x,e.clientY-lastDown.y)<6;
  lastDown=e.button===0?{t:now,x:e.clientX,y:e.clientY}:null;
  dblPending=null;
  if(isDbl){
    lastDown=null;
    // với công cụ chọn: chỉ coi là nhấp đúp khi nhả chuột mà không kéo
    if((tool==='select'||tool==='scale')&&!(vedit&&ds.vn)){dblPending={x:e.clientX,y:e.clientY,target:e.target,clientX:e.clientX,clientY:e.clientY}}
    else if(handleDouble(e))return;
  }
  if(e.button===1||tool==='hand'||spaceDown){
    drag={type:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};
    cv.style.cursor='grabbing';return;
  }
  if(e.button!==0)return;
  if(rulersOn){
    if(ds.ruler){
      pushHistory();
      guides.push({a:ds.ruler==='top'?'y':'x',p:ds.ruler==='top'?p.y:p.x});
      drag={type:'guide',idx:guides.length-1};render({noLayers:true,noPanel:true});return;
    }
    if(ds.gd!=null){pushHistory();drag={type:'guide',idx:+ds.gd};return}
  }
  if(tool==='pen'){penDownAt(e,p);return}
  if(tool==='pencil'){pencil={pts:[[p.x,p.y]]};return}
  if(tool!=='select'&&tool!=='scale'){startDraw(p,e);return}
  if(vedit&&veditDown(e,p,ds))return;
  if(ds.rot){
    const S=selObjs().filter(o=>!o.locked);
    const single=S.length===1?S[0]:null;
    if(single&&single.rot===0&&false)return;
    if(single){const l=toLocal(single,p);if(l.x>=single.x&&l.x<=single.x+single.w&&l.y>=single.y&&l.y<=single.y+single.h){/* bên trong hộp: coi như nhấp thường */}else{startRotate(S,p);return}}
    else if(S.length){const B=union(S);if(!(p.x>=B.x&&p.x<=B.x+B.w&&p.y>=B.y&&p.y<=B.y+B.h)){startRotate(S,p);return}}
  }
  if(ds.h){
    const S=selObjs().filter(o=>!o.locked);
    if(tool==='scale'&&S.length){
      const tops=topsOf(S);
      drag={type:'scaleDeep',h:ds.h,tops,B0:union(tops),S0:deepSnap(withChildren(tops)),pushed:false};
      return;
    }
    if(S.length===1){
      const o=S[0];
      drag={type:'resize1',h:ds.h,o,orig:{...o},S0:snapMap(withChildren([o])),snapT:snapActive(e)?snapLines(new Set(withChildren([o]).map(x=>x.id))):null,pushed:false};
    }else if(S.length>1){
      const tops=topsOf(S);
      drag={type:'resizeN',h:ds.h,tops,B0:union(tops),S0:snapMap(withChildren(tops)),pushed:false};
    }
    return;
  }
  const id=ds.lbl||hit(p);
  if(id){
    if(e.shiftKey){sel.has(id)?sel.delete(id):sel.add(id)}
    else if(!sel.has(id))sel=new Set([id]);
    const mv=withChildren(selObjs()).filter(o=>!o.locked&&!o.hidden);
    const tops=topsOf(selObjs().filter(o=>!o.locked));
    drag={type:'move',start:p,sxp:e.clientX,syp:e.clientY,items:mv.map(o=>({o,x:o.x,y:o.y})),pushed:false,alt:e.altKey,
      B0:tops.length?union(tops):null,snapT:snapActive(e)?snapLines(new Set(mv.map(o=>o.id))):null};
    render();
  }else{
    const base=e.shiftKey?new Set(sel):new Set();
    if(!e.shiftKey)sel=new Set();
    drag={type:'marquee',start:p,base,rect:{x:p.x,y:p.y,w:0,h:0}};
    render();
  }
}
function startRotate(S,p){
  const B=union(S);
  const pv=S.length===1?ctrOf(S[0]):{x:B.x+B.w/2,y:B.y+B.h/2};
  const all=withChildren(S).filter(o=>!o.locked);
  drag={type:'rotate',pivot:pv,a0:Math.atan2(p.y-pv.y,p.x-pv.x)*180/Math.PI,
    items:all.map(o=>({o,cx:o.x+o.w/2,cy:o.y+o.h/2,rot:o.rot||0})),first:S[0].rot||0,pushed:false};
}
function startDraw(p,e){
  pushHistory();
  const t=tool,T=snapActive(e)?allSnapT():null;
  let q=p;
  if(T){const s=snapPt(p,T);q={x:s.x,y:s.y};snapGuides=s.guides}
  let o;
  if(t==='text')o=mk('text',{x:q.x,y:q.y,w:0,text:''});
  else if(t==='section'){
    o=mk('frame',{x:q.x,y:q.y,w:0,h:0,sec:true,fill:'#F2F2F5',clip:false,r:10,name:'Section '+(objs.filter(x=>x.sec).length+1)});
  }else if(t==='slice'){
    o=mk('slice',{x:q.x,y:q.y,w:0,h:0,name:'Slice '+(objs.filter(x=>x.type==='slice').length+1)});
  }else{
    o=mk(t,{x:q.x,y:q.y,w:0,h:0,name:autoName(t)});
    if(t==='frame')o.clip=true;
  }
  objs.push(o);sel=new Set([o.id]);
  drag={type:'draw',o,start:q,snapT:T};
  render({noLayers:true});
}
function onMove(e){
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pointers.size>=2){doPinch();return}
  const p=toWorld(e);
  if(pencil&&!drag&&e.buttons){
    const l=pencil.pts[pencil.pts.length-1];
    if(Math.hypot(p.x-l[0],p.y-l[1])*view.z>2.5){pencil.pts.push([p.x,p.y]);drawOverlay()}
    return;
  }
  if(!drag){
    if(tool==='pen'&&pen){pen.hoverPt=p;drawOverlay();return}
    if((tool==='select'||tool==='scale')&&!spaceDown){
      const ds=(e.target&&e.target.dataset)||{};
      const h=(ds.h||ds.lbl||ds.rot||ds.vn||ds.vh)?null:hit(p);
      let ch=false;
      if(h!==hover){hover=h;ch=true}
      const m=altDown&&sel.size&&h&&!sel.has(h)?{a:union(selObjs()),b:aabb(byId(h))}:null;
      if(m||measure){measure=m;ch=true}
      if(ch)drawOverlay();
    }
    return;
  }
  if(drag.type==='pan'){
    view.x=drag.vx+(e.clientX-drag.sx);view.y=drag.vy+(e.clientY-drag.sy);
    render({noLayers:true,noPanel:true});return;
  }
  if(drag.type==='guide'){
    const g=guides[drag.idx];if(!g)return;
    g.p=g.a==='x'?p.x:p.y;
    render({noLayers:true,noPanel:true});return;
  }
  if(drag.type==='pen'){
    const n=pen.nodes[drag.i];
    const dx=p.x-n.x,dy=p.y-n.y;
    if(Math.hypot(dx,dy)*view.z>3){n.ox=dx;n.oy=dy;n.ix=-dx;n.iy=-dy;n.sm=true}
    drawOverlay();return;
  }
  if(drag.type==='vnode'||drag.type==='vhandle'){moveVector(e,p);return}
  if(drag.type==='draw'){
    const o=drag.o,s=drag.start;
    let q=p;
    snapGuides=[];
    if(drag.snapT&&snapActive(e)){const sn=snapPt(p,drag.snapT);q={x:sn.x,y:sn.y};snapGuides=sn.guides}
    let dx=q.x-s.x,dy=q.y-s.y;
    if(e.shiftKey&&!isLineLike(o)&&o.type!=='text'){const m=Math.max(Math.abs(dx),Math.abs(dy));dx=Math.sign(dx||1)*m;dy=Math.sign(dy||1)*m}
    if(e.shiftKey&&isLineLike(o)){
      const a=Math.atan2(dy,dx),sn=Math.round(a/(Math.PI/4))*(Math.PI/4),len=Math.hypot(dx,dy);
      dx=Math.cos(sn)*len;dy=Math.sin(sn)*len;
    }
    if(o.type==='text'){
      o.x=Math.min(s.x,s.x+dx);o.w=Math.abs(dx);drag.dw=Math.abs(dx)*view.z;
      render({noLayers:true});return;
    }
    if(e.altKey&&!isLineLike(o)){o.x=s.x-Math.abs(dx);o.y=s.y-Math.abs(dy);o.w=Math.abs(dx)*2;o.h=Math.abs(dy)*2;o.flip=false;render({noLayers:true});return}
    o.x=Math.min(s.x,s.x+dx);o.y=Math.min(s.y,s.y+dy);
    o.w=Math.abs(dx);o.h=Math.abs(dy);
    o.flip=(dx<0)!==(dy<0);
    render({noLayers:true});return;
  }
  if(drag.type==='move'){
    if(!drag.pushed){
      if(Math.hypot(e.clientX-drag.sxp,e.clientY-drag.syp)<3)return;
      pushHistory();drag.pushed=true;
      if(drag.alt){
        const cl=cloneSet(withChildren(selObjs()),0,0);
        cl.forEach(c=>objs.push(c));
        sel=new Set(topsOf(cl).map(c=>c.id));
        drag.items=cl.filter(o=>!o.locked&&!o.hidden).map(o=>({o,x:o.x,y:o.y}));
        drag.snapT=snapActive(e)?snapLines(new Set(cl.map(o=>o.id))):null;
      }
    }
    let dx=p.x-drag.start.x,dy=p.y-drag.start.y;
    if(e.shiftKey){if(Math.abs(dx)>Math.abs(dy))dy=0;else dx=0}
    snapGuides=[];
    if(drag.snapT&&drag.B0&&snapActive(e)){
      const sn=snapBox(drag.B0,dx,dy,drag.snapT);dx=sn.dx;dy=sn.dy;snapGuides=sn.guides;
    }
    drag.items.forEach(i=>{i.o.x=i.x+dx;i.o.y=i.y+dy});
    render({noLayers:true});return;
  }
  if(drag.type==='rotate'){
    if(!drag.pushed){pushHistory();drag.pushed=true}
    let d=Math.atan2(p.y-drag.pivot.y,p.x-drag.pivot.x)*180/Math.PI-drag.a0;
    if(e.shiftKey){const t=Math.round((drag.first+d)/15)*15;d=t-drag.first}
    drag.items.forEach(i=>{
      const c=rotAbout({x:i.cx,y:i.cy},drag.pivot,d);
      i.o.x=c.x-i.o.w/2;i.o.y=c.y-i.o.h/2;
      let r=(i.rot+d)%360;if(r>180)r-=360;if(r<=-180)r+=360;
      i.o.rot=r2(r);
    });
    render({noLayers:true});return;
  }
  if(drag.type==='resize1'){doResize1(e,p);return}
  if(drag.type==='scaleDeep'){
    if(!drag.pushed){pushHistory();drag.pushed=true}
    const {B0,h}=drag;
    let x1=B0.x,x2=B0.x+B0.w,y1=B0.y,y2=B0.y+B0.h;
    if(h.includes('w'))x1=p.x;if(h.includes('e'))x2=p.x;
    if(h.includes('n'))y1=p.y;if(h.includes('s'))y2=p.y;
    if(h.length===2&&B0.w&&B0.h){
      const k=Math.max(Math.abs(x2-x1)/B0.w,Math.abs(y2-y1)/B0.h);
      if(h.includes('w')){x2=B0.x+B0.w;x1=x2-B0.w*k}else{x1=B0.x;x2=x1+B0.w*k}
      if(h.includes('n')){y2=B0.y+B0.h;y1=y2-B0.h*k}else{y1=B0.y;y2=y1+B0.h*k}
    }
    deepScale(drag.tops,B0,{x:Math.min(x1,x2),y:Math.min(y1,y2),w:Math.max(1,Math.abs(x2-x1)),h:Math.max(1,Math.abs(y2-y1))},drag.S0);
    render({noLayers:true});return;
  }
  if(drag.type==='resizeN'){
    if(!drag.pushed){pushHistory();drag.pushed=true}
    const {B0,h}=drag;
    let x1=B0.x,x2=B0.x+B0.w,y1=B0.y,y2=B0.y+B0.h;
    if(h.includes('w'))x1=p.x;if(h.includes('e'))x2=p.x;
    if(h.includes('n'))y1=p.y;if(h.includes('s'))y2=p.y;
    if(e.shiftKey&&h.length===2&&B0.w&&B0.h){
      const k=Math.max(Math.abs(x2-x1)/B0.w,Math.abs(y2-y1)/B0.h);
      if(h.includes('w')){x2=B0.x+B0.w;x1=x2-B0.w*k}else{x1=B0.x;x2=x1+B0.w*k}
      if(h.includes('n')){y2=B0.y+B0.h;y1=y2-B0.h*k}else{y1=B0.y;y2=y1+B0.h*k}
    }
    scaleGroup(drag.tops,B0,{x:Math.min(x1,x2),y:Math.min(y1,y2),w:Math.max(1,Math.abs(x2-x1)),h:Math.max(1,Math.abs(y2-y1))},drag.S0);
    render({noLayers:true});return;
  }
  if(drag.type==='marquee'){
    const s=drag.start;
    const m={x:Math.min(s.x,p.x),y:Math.min(s.y,p.y),w:Math.abs(p.x-s.x),h:Math.abs(p.y-s.y)};
    drag.rect=m;
    const ns=new Set(drag.base),hid=hiddenIds();
    objs.forEach(o=>{
      if(hid.has(o.id)||o.locked)return;
      const b=aabb(o);
      const inter=b.x<m.x+m.w&&b.x+b.w>m.x&&b.y<m.y+m.h&&b.y+b.h>m.y;
      const inside=b.x>=m.x&&b.y>=m.y&&b.x+b.w<=m.x+m.w&&b.y+b.h<=m.y+m.h;
      if(o.type==='frame'?inside:inter)ns.add(o.id);
    });
    sel=ns;
    render({noLayers:true});
  }
}
function doResize1(e,p){
  if(!drag.pushed){
    pushHistory();drag.pushed=true;
    const o=drag.o;if(o.lay)o.lay.hug=false;
  }
  const {o,orig,h}=drag;
  let q=p;snapGuides=[];
  if(drag.snapT&&!orig.rot&&snapActive(e)){const sn=snapPt(p,drag.snapT);q={x:sn.x,y:sn.y};snapGuides=sn.guides}
  const c0=ctrOf(orig),pl=orig.rot?rotAbout(q,c0,-orig.rot):q;
  let x1=orig.x,x2=orig.x+orig.w,y1=orig.y,y2=orig.y+orig.h;
  if(h.includes('w'))x1=pl.x;if(h.includes('e'))x2=pl.x;
  if(h.includes('n'))y1=pl.y;if(h.includes('s'))y2=pl.y;
  if(e.altKey){
    if(h.includes('w')||h.includes('e')){const d=Math.abs(pl.x-c0.x);x1=c0.x-d;x2=c0.x+d}
    if(h.includes('n')||h.includes('s')){const d=Math.abs(pl.y-c0.y);y1=c0.y-d;y2=c0.y+d}
  }
  const keep=(e.shiftKey||orig.lk||orig.type==='image'&&!e.shiftKey&&false)&&h.length===2&&orig.w&&orig.h&&!e.altKey;
  if(keep){
    const k=Math.max(Math.abs(x2-x1)/orig.w,Math.abs(y2-y1)/orig.h);
    if(h.includes('w')){x2=orig.x+orig.w;x1=x2-orig.w*k}else{x1=orig.x;x2=x1+orig.w*k}
    if(h.includes('n')){y2=orig.y+orig.h;y1=y2-orig.h*k}else{y1=orig.y;y2=y1+orig.h*k}
  }
  const min=isLineLike(orig)||orig.type==='path'?0.01:1;
  let W=Math.max(min,Math.abs(x2-x1)),Hh=Math.max(min,Math.abs(y2-y1));
  if(orig.type==='text'){
    if(h==='n'||h==='s')W=orig.w;
    if(h==='e'||h==='w')Hh=orig.h;
  }
  const mid={x:(Math.min(x1,x2)+Math.max(x1,x2))/2,y:(Math.min(y1,y2)+Math.max(y1,y2))/2};
  // giữ cạnh đối diện cố định khi bị kẹp kích thước tối thiểu
  const ax=h.includes('w')?x2:h.includes('e')?x1:null,ay=h.includes('n')?y2:h.includes('s')?y1:null;
  let mx=mid.x,my=mid.y;
  if(!e.altKey){
    if(ax!=null)mx=h.includes('w')?ax-W/2:ax+W/2;
    if(ay!=null)my=h.includes('n')?ay-Hh/2:ay+Hh/2;
  }
  const wc=orig.rot?rotAbout({x:mx,y:my},c0,orig.rot):{x:mx,y:my};
  const nb={x:wc.x-W/2,y:wc.y-Hh/2,w:W,h:Hh};
  if(orig.type==='text'){
    if(h.includes('e')||h.includes('w')){if(o.tm==='auto')o.tm='height'}
    if(h.includes('n')||h.includes('s'))o.tm='fixed';
  }
  applyBox(o,nb,drag.S0,objs);
  if(o.type==='text')fitText(o);
  render({noLayers:true});
}
function onUp(e){
  pointers.delete(e.pointerId);
  const dp=dblPending;dblPending=null;
  if(dp&&Math.hypot(e.clientX-dp.x,e.clientY-dp.y)<4){
    const d0=drag;drag=null;snapGuides=[];
    if(d0&&d0.type==='marquee')sel=d0.base;
    if(handleDouble(dp))return;
    drag=d0;
  }
  if(pinch){if(pointers.size<2)pinch=null;if(!pointers.size)drag=null;return}
  const d=drag;drag=null;snapGuides=[];
  cv.style.cursor=cursorFor();
  if(pencil&&!d){finishPencil();return}
  if(!d){return}
  if(d.type==='pen'){render({noLayers:true,noPanel:true});return}
  if(d.type==='guide'){
    const g=guides[d.idx];
    if(g){
      const r=cv.getBoundingClientRect();
      const out=g.a==='x'?(e.clientX-r.left<20):(e.clientY-r.top<20);
      if(out)guides.splice(d.idx,1);
    }
    render({noLayers:true,noPanel:true});return;
  }
  if(d.type==='draw'){
    const o=d.o;
    if(o.type==='text'){
      if(!(d.dw>=8)){o.tm='auto';o.x=d.start.x}else o.tm='height';
      fitText(o);settleParents([o]);
      setTool('select');render();editText(o,true);return;
    }
    if(isLineLike(o)){if(o.w<3&&o.h<3){o.w=120;o.h=0;o.flip=false}}
    else if(o.w<4&&o.h<4){
      if(o.type==='frame'){o.w=o.sec?640:360;o.h=o.sec?420:640}else{o.w=100;o.h=100}
    }
    settleParents([o]);
    if(o.type==='frame'){
      objs.forEach(c=>{if(c!==o&&(o.sec||c.type!=='frame')&&c.type!=='slice'&&c.parent===o.parent){const b=aabb(c);const cx=b.x+b.w/2,cy=b.y+b.h/2;if(cx>=o.x&&cx<=o.x+o.w&&cy>=o.y&&cy<=o.y+o.h)c.parent=o.id}});
    }
    setTool('select');render();return;
  }
  if(d.type==='move'&&d.pushed){settleParents(selObjs());render();return}
  if(d.type==='vnode'||d.type==='vhandle'){render();return}
  if(d.type==='resize1'||d.type==='resizeN'||d.type==='marquee'||d.type==='rotate'||d.type==='scaleDeep')render();
}

function handleDouble(e){
  const ds=(e.target&&e.target.dataset)||{};
  if(tool==='pen'&&pen){penFinish();return true}
  if(vedit&&ds.vn){toggleSmooth(ds.vn);return true}
  if((tool!=='select'&&tool!=='scale')||ds.h)return false;
  if(ds.lbl){sel=new Set([ds.lbl]);render();renameSel();return true}
  const id=hit(toWorld(e));
  if(ds.rot&&!id)return false;
  const o=id&&byId(id);

function doPinch(){

function rdp(pts,eps){

}

        const t=k/N,u=1-t;

const _cc=document.createElement('canvas').getContext('2d');
function toHex(c){
  if(!c)return '';
  c=c.trim();
  if(c[0]==='#')return full(c).toUpperCase();
  const m=c.match(/rgba?\((\d+)[ ,]+(\d+)[ ,]+(\d+)/);
  if(m)return '#'+[m[1],m[2],m[3]].map(v=>(+v).toString(16).padStart(2,'0')).join('').toUpperCase();

}
function domToRuns(root){
  const out=[];let blocks=0;
  const same=(a,b)=>!!a.b===!!b.b&&!!a.i===!!b.i&&!!a.u===!!b.u&&!!a.s===!!b.s&&(a.c||'')===(b.c||'');
  const push=(t,st)=>{
    if(!t)return;
    const last=out[out.length-1];
    if(last&&same(last,st))last.t+=t;else out.push({t,...st});
  };
  const walk=(n,st)=>{
    if(n.nodeType===3){push(n.nodeValue.replace(/ /g,' '),st);return}
    if(n.nodeType!==1)return;
    const tag=n.tagName;
    if(tag==='BR'){
      const p=n.parentNode;
      const only=p!==root&&p.childNodes.length===1&&/^(DIV|P)$/.test(p.tagName);
      if(!only)push('\n',st);
      return;
    }
    if(n===root){n.childNodes.forEach(ch=>walk(ch,st));return}
    const s={...st},cs=n.style||{};
    if(tag==='B'||tag==='STRONG'||cs.fontWeight==='bold'||+cs.fontWeight>=600)s.b=1;
    if(tag==='I'||tag==='EM'||cs.fontStyle==='italic')s.i=1;
    const td=cs.textDecorationLine||cs.textDecoration||'';
    if(tag==='U'||/underline/.test(td))s.u=1;
    if(tag==='S'||tag==='STRIKE'||/line-through/.test(td))s.s=1;
    const col=(n.getAttribute&&n.getAttribute('color'))||cs.color;

    n.childNodes.forEach(ch=>walk(ch,s));

  walk(root,{});

function readImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej();
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej();
      img.onload=()=>{
        const max=1600,k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
        if(k===1&&file.size<600000){res({url:fr.result,w:img.naturalWidth,h:img.naturalHeight});return}
        const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const png=/png|gif|webp|svg/.test(file.type);
        res({url:c.toDataURL(png?'image/png':'image/jpeg',0.88),w:img.naturalWidth,h:img.naturalHeight});
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function addImages(files,pos){

  for(const f of list){

function renderLayerList(){

  };

    const q=layerQuery.toLowerCase();

    h=m.length?m.map(o=>row(o,0,true)).join(''):'<div class="empty">Không có lớp nào khớp.</div>';
  }else{
    if(!objs.length)h='<div class="empty">Chưa có gì. Chọn một công cụ và vẽ lên canvas.</div>';

let dnd=null;
function clearDt(){layList.querySelectorAll('.dt-b,.dt-a,.dt-i').forEach(r=>r.classList.remove('dt-b','dt-a','dt-i'))}
layList.addEventListener('dragstart',e=>{
  const r=e.target.closest('.row[data-id]');if(!r){return}
  const id=r.dataset.id;
  if(!sel.has(id)){sel=new Set([id]);drawOverlay()}
  dnd={ids:[...sel]};
  e.dataTransfer.setData('text/plain','layer');e.dataTransfer.effectAllowed='move';
});
layList.addEventListener('dragover',e=>{
  if(!dnd||layerQuery)return;
  const r=e.target.closest('.row[data-id]');if(!r)return;
  e.preventDefault();
  clearDt();
  const t=byId(r.dataset.id),rc=r.getBoundingClientRect(),y=(e.clientY-rc.top)/rc.height;
  const zone=t&&t.type==='frame'?(y<.25?'b':y>.75?'a':'i'):(y<.5?'b':'a');
  r.classList.add('dt-'+zone);r.dataset.zone=zone;
});
layList.addEventListener('dragend',()=>{dnd=null;clearDt()});
layList.addEventListener('drop',e=>{
  if(!dnd)return;
  const r=e.target.closest('.row[data-id]');if(!r)return;
  e.preventDefault();
  const zone=r.dataset.zone||'a',tid=r.dataset.id;
  const ids=dnd.ids;dnd=null;clearDt();
  moveLayers(ids,tid,zone);
});
function moveLayers(ids,tid,zone){
  const target=byId(tid);if(!target)return;
  const moving=topsOf(objs.filter(o=>ids.includes(o.id)));
  if(!moving.length)return;
  const blockIds=new Set(withChildren(moving).map(o=>o.id));
  if(blockIds.has(tid))return;
  pushHistory();
  const block=objs.filter(o=>blockIds.has(o.id));
  objs=objs.filter(o=>!blockIds.has(o.id));
  let idx;
  if(zone==='i'){
    moving.forEach(m=>{m.parent=target.id});
    const sub=subtree(target);idx=(sub.length?objs.indexOf(sub[sub.length-1]):objs.indexOf(target))+1;
  }else{
    moving.forEach(m=>{m.parent=target.parent});
    if(zone==='b'){const sub=subtree(target);idx=(sub.length?objs.indexOf(sub[sub.length-1]):objs.indexOf(target))+1}
    else idx=objs.indexOf(target);
  }
  objs.splice(idx,0,...block);
  render();
}
