function cssFor(o){
  const par=o.parent&&byId(o.parent),L=[];
  const px=v=>r1(v)+'px';
  L.push(`width: ${px(o.w)};`,`height: ${px(o.h)};`);
  if(par&&!par.lay)L.push('position: absolute;',`left: ${px(o.x-par.x)};`,`top: ${px(o.y-par.y)};`);
  if(o.rot)L.push(`transform: rotate(${r1(o.rot)}deg);`);
  if(o.op<1)L.push(`opacity: ${r2(o.op)};`);
  const pf=resolvedFill(o);
  if(o.type==='text'){
    L.push(`font-family: '${o.ff}';`,`font-size: ${px(o.fs)};`,`font-weight: ${o.fw};`,`line-height: ${r2(o.lh||1.3)};`);
    if(o.it)L.push('font-style: italic;');
    if(o.ls)L.push(`letter-spacing: ${px(o.ls)};`);
    L.push(`text-align: ${o.ta};`);
    if(o.td)L.push(`text-decoration: ${o.td};`);
    if(o.tc)L.push(`text-transform: ${o.tc==='upper'?'uppercase':o.tc==='lower'?'lowercase':'capitalize'};`);
    L.push(`color: ${pf.grad?cssGrad(pf.grad):(pf.color||'inherit')};`);
  }else{
    if(!isLineLike(o)){
      if(pf.grad)L.push(`background: ${cssGrad(pf.grad)};`);
      else if(pf.color)L.push(`background: ${pf.color};`);
    }
    if(o.stroke&&o.sw>0)L.push(`border: ${px(o.sw)} ${o.sd==='dash'?'dashed':o.sd==='dot'?'dotted':'solid'} ${o.stroke};`);
    if(o.type==='ellipse')L.push('border-radius: 50%;');
    else{const rr=radii(o);if(rr.some(v=>v))L.push('border-radius: '+(rr.every(v=>v===rr[0])?px(rr[0]):rr.map(px).join(' '))+';')}
  }
  const sh=(o.fx||[]).filter(f=>!f.off&&(f.t==='drop'||f.t==='inner')).map(f=>`${f.t==='inner'?'inset ':''}${f.x||0}px ${f.y||0}px ${f.b||0}px ${hexA(f.c||'#000000',f.o==null?.25:f.o)}`);
  if(sh.length)L.push(`box-shadow: ${sh.join(', ')};`);
  const bl=(o.fx||[]).find(f=>!f.off&&f.t==='blur');
  if(bl)L.push(`filter: blur(${r1((bl.b||0)/2)}px);`);
  if(o.bm)L.push(`mix-blend-mode: ${o.bm};`);
  if(o.type==='frame'&&o.lay){
    const l=o.lay;
    L.push('display: flex;',`flex-direction: ${l.dir==='v'?'column':'row'};`,`gap: ${px(l.gap)};`);
    const ph=l.px!=null?l.px:l.pad,pv=l.py!=null?l.py:l.pad;
    L.push(`padding: ${px(pv)} ${px(ph)};`);
    const m={start:'flex-start',center:'center',end:'flex-end',between:'space-between'};
    L.push(`align-items: ${m[l.alg||'start']};`,`justify-content: ${m[l.hug?'start':(l.mj||'start')]};`);
  }
  if(o.type==='frame'&&o.clip!==false)L.push('overflow: hidden;');
  return L.join('\n');
}
function hexA(c,a){
  if(!hexOk(c))return c;

  return `rgba(${r}, ${g}, ${b}, ${r2(a)})`;
}

/* ---------- thao tác trên lựa chọn ---------- */
function moveItems(items,dx,dy){items.forEach(o=>{o.x+=dx;o.y+=dy})}
function align(a,S){
  const tops=topsOf(S);
  let T;
  if(tops.length===1){const f=byId(tops[0].parent);if(!f)return;T=aabb(f)}else T=union(tops);
  pushHistory();
  tops.forEach(o=>{
    const b=aabb(o);let dx=0,dy=0;
    if(a==='al')dx=T.x-b.x;
    if(a==='ach')dx=T.x+T.w/2-(b.x+b.w/2);
    if(a==='ar')dx=T.x+T.w-(b.x+b.w);
    if(a==='at')dy=T.y-b.y;
    if(a==='acv')dy=T.y+T.h/2-(b.y+b.h/2);
    if(a==='ab')dy=T.y+T.h-(b.y+b.h);
    moveItems(withChildren([o]),dx,dy);
  });
  render();
}
function distribute(axis,S){
  const tops=topsOf(S);
  if(tops.length<3){toast('Cần chọn ít nhất 3 đối tượng để chia đều khoảng cách');return}
  pushHistory();
  const k=axis==='h'?'x':'y',d=axis==='h'?'w':'h';
  const arr=tops.map(o=>({o,b:aabb(o)})).sort((p,q)=>(p.b[k]+p.b[d]/2)-(q.b[k]+q.b[d]/2));
  const start=arr[0].b[k],end=arr[arr.length-1].b[k]+arr[arr.length-1].b[d];
  const sum=arr.reduce((t,i)=>t+i.b[d],0),gap=(end-start-sum)/(arr.length-1);
  let cur=start;
  arr.forEach(i=>{
    const delta=cur-i.b[k];
    moveItems(withChildren([i.o]),axis==='h'?delta:0,axis==='v'?delta:0);
    cur+=i.b[d]+gap;
  });
  render();
}
function moveZ(dir,toEnd){
  const S=selObjs();if(!S.length)return;
  pushHistory();
  const ids=new Set(S.map(o=>o.id));
  [...new Set(S.map(o=>o.parent||''))].forEach(k=>{
    const sibs=objs.filter(o=>(o.parent||'')===k),slots=sibs.map(o=>objs.indexOf(o));
    let order=sibs.slice();
    if(toEnd){
      const mv=order.filter(o=>ids.has(o.id)),rest=order.filter(o=>!ids.has(o.id));
      order=dir>0?rest.concat(mv):mv.concat(rest);
    }else if(dir>0){
      for(let i=order.length-2;i>=0;i--)if(ids.has(order[i].id)&&!ids.has(order[i+1].id)){[order[i],order[i+1]]=[order[i+1],order[i]]}
    }else{
      for(let i=1;i<order.length;i++)if(ids.has(order[i].id)&&!ids.has(order[i-1].id)){[order[i],order[i-1]]=[order[i-1],order[i]]}
    }
    order.forEach((o,i)=>{objs[slots[i]]=o});
  });
  render();
}

function ungroupSel(){
  const F=selObjs().filter(o=>o.type==='frame'&&!o.comp);
  if(!F.length){toast('Chọn Frame hoặc nhóm để rã');return}
  pushHistory();
  const ns=new Set();
  F.forEach(f=>{
    objs.filter(c=>c.parent===f.id).forEach(c=>{c.parent=f.parent;ns.add(c.id)});
    objs=objs.filter(o=>o!==f);
  });
  sel=ns;render();
}
function toggleFlag(flag){
  const S=selObjs();if(!S.length)return;
  pushHistory();
  const v=!S.every(o=>o[flag]);
  S.forEach(o=>{o[flag]=v;if(flag==='hidden'&&o.bind&&o.bind.visible){delete o.bind.visible;if(!Object.keys(o.bind).length)o.bind=null}});
  render();
}
function flipSel(axis){
  const S=selObjs();if(!S.length)return;
  pushHistory();
  const B=union(S);
  withChildren(S).forEach(o=>{
    if(axis==='x')o.x=B.x*2+B.w-o.x-o.w;else o.y=B.y*2+B.h-o.y-o.h;
    mirrorShape(o,axis);
    if(o.rot)o.rot=-o.rot;
  });
  render();
}
/* lật hình dạng tại chỗ (hộp bao giữ nguyên) */
function mirrorShape(o,axis){
  if(isLineLike(o)){o.flip=!o.flip;return}
  if(o.rr&&o.rr.length===4){const [a,b,c,d]=o.rr;o.rr=axis==='x'?[b,a,d,c]:[d,c,b,a]}
  if(axis==='y'&&(o.type==='polygon'||o.type==='star')){const r=o.rot;o.rot=0;convertToPath(o);o.rot=r}
  if(o.type==='path'){
    const W=o.pw||o.w,H=o.ph||o.h;
    (o.pc||[]).forEach(c=>c.n.forEach(q=>{
      if(axis==='x'){q.x=W-q.x;q.ix=-q.ix;q.ox=-q.ox}else{q.y=H-q.y;q.iy=-q.iy;q.oy=-q.oy}
    }));
  }
}
function rotateItems(items,pivot,d){
  items.forEach(o=>{
    const c=rotAbout({x:o.x+o.w/2,y:o.y+o.h/2},pivot,d);
    o.x=c.x-o.w/2;o.y=c.y-o.h/2;
    let r=((o.rot||0)+d)%360;if(r>180)r-=360;if(r<=-180)r+=360;
    o.rot=r2(r);
  });
}
function copyProps(){
  const o=selObjs()[0];if(!o)return;
  propClip={fill:o.fill,fo:o.fo,grad:o.grad?JSON.parse(JSON.stringify(o.grad)):null,fsid:o.fsid,stroke:o.stroke,sw:o.sw,so:o.so,sd:o.sd,r:o.r,rr:o.rr,op:o.op,bm:o.bm,fx:JSON.parse(JSON.stringify(o.fx||[])),fs:o.fs,fw:o.fw,ff:o.ff,lh:o.lh,ls:o.ls};
  toast('Đã sao chép thuộc tính');
}
function pasteProps(){
  const S=selObjs();if(!propClip||!S.length)return;
  pushHistory();
  S.forEach(o=>{
    if(o.type==='inst')return;
    if(!isLineLike(o)){o.fill=propClip.fill;o.fo=propClip.fo;o.grad=propClip.grad?JSON.parse(JSON.stringify(propClip.grad)):null;o.fsid=propClip.fsid}
    if(isLineLike(o)){if(propClip.stroke){o.stroke=propClip.stroke;o.sw=propClip.sw||2}}
    else if(o.type!=='text'){o.stroke=propClip.stroke;o.sw=propClip.sw;o.so=propClip.so;o.sd=propClip.sd}
    if(['rect','frame','image'].includes(o.type)){o.r=propClip.r;o.rr=propClip.rr}
    o.op=propClip.op;o.bm=propClip.bm;o.fx=JSON.parse(JSON.stringify(propClip.fx));
    if(o.type==='text'){o.fs=propClip.fs;o.fw=propClip.fw;o.ff=propClip.ff;o.lh=propClip.lh;o.ls=propClip.ls;fitText(o)}
  });
  render();
}
function renameSel(){
  const o=selObjs()[0];if(!o)return;
  const el=layList.querySelector(`.row[data-id="${o.id}"] .nm`);
  if(el)el.dispatchEvent(new MouseEvent('dblclick',{bubbles:true}));
}
function selectSibling(dir){
  const S=selObjs(),hid=hiddenIds();
  const pool=objs.filter(o=>(o.parent||'')===(S.length?(S[0].parent||''):'')&&!hid.has(o.id)&&!o.locked);
  if(!pool.length)return;
  const i=S.length?pool.findIndex(o=>o.id===S[0].id):-1;
  const n=i<0?(dir>0?0:pool.length-1):(i+dir+pool.length)%pool.length;
  sel=new Set([pool[n].id]);render();
}
function enterSel(shift){
  const S=selObjs();if(S.length!==1)return;
  const o=S[0];
  if(shift){const p=o.parent&&byId(o.parent);if(p){sel=new Set([p.id]);render()}return}
  if(o.type==='text'){editText(o,false);return}
  if(['path','rect','ellipse','polygon','star','line','arrow'].includes(o.type)){enterVedit(o);return}
  const kids=objs.filter(c=>c.parent===o.id&&!c.hidden&&!c.locked);
  if(kids.length){sel=new Set(kids.map(c=>c.id));render()}
}

/* ---------- đổi cỡ, xoay từ bảng thuộc tính ---------- */
function resizeBy(S,k,val){
  if(S.length===1){
    const o=S[0];
    if(o.lay)o.lay.hug=false;
    const S0=snapMap(withChildren([o]));
    let W=o.w,H=o.h;
    if(k==='w'){W=val;if(o.lk&&o.w)H=o.h*val/o.w}else{H=val;if(o.lk&&o.h)W=o.w*val/o.h}
    if(o.type==='text'){if(k==='w'&&o.tm==='auto')o.tm='height';if(k==='h')o.tm='fixed'}
    const c=ctrOf(o);
    const nb=o.rot?{x:c.x-W/2,y:c.y-H/2,w:W,h:H}:{x:o.x,y:o.y,w:W,h:H};
    applyBox(o,nb,S0,objs);
    if(o.type==='text')fitText(o);
    return;
  }
  const tops=topsOf(S),B0=union(tops),S0=snapMap(withChildren(tops));
  const nb={x:B0.x,y:B0.y,w:k==='w'?Math.max(1,val):B0.w,h:k==='h'?Math.max(1,val):B0.h};
  scaleGroup(tops,B0,nb,S0);
}
function rotateTo(S,deg){
  const B=union(S);
  if(S.length===1){
    const o=S[0],d=deg-(o.rot||0);
    rotateItems(withChildren([o]),ctrOf(o),d);
    o.rot=r2(((deg+180)%360+360)%360-180);
  }else rotateItems(withChildren(S),{x:B.x+B.w/2,y:B.y+B.h/2},deg);
}

/* ---------- boolean, flatten, mặt nạ ---------- */
function flatRing(c){
  const pts=[],n=c.n;
  if(!n.length)return pts;
  pts.push([n[0].x,n[0].y]);
  for(let i=1;i<n.length;i++)bezSamples(n[i-1],n[i],16).forEach(p=>pts.push(p));
  if(c.c&&n.length>1)bezSamples(n[n.length-1],n[0],16).forEach(p=>pts.push(p));
  if(pts.length)pts.push([pts[0][0],pts[0][1]]);
  return pts;
}
function objGeom(o){
  const rings=shapeContours(o).map(flatRing).filter(r=>r.length>=4);
  if(!rings.length)return null;
  if(rings.length===1)return [[rings[0]]];
  return polygonClipping.xor(...rings.map(r=>[[r]]));
}
const BOOL_NAME={union:'Hợp',sub:'Trừ',int:'Giao',xor:'Loại trừ'};
function boolOp(kind){
  const S=selObjs().filter(o=>!['text','inst','image','frame'].includes(o.type));
  if(S.length<2){toast('Chọn ít nhất 2 hình (không phải khung, chữ, ảnh) để dùng boolean');return}
  if(typeof polygonClipping==='undefined'){toast('Chưa tải được thư viện boolean. Hãy kiểm tra kết nối mạng rồi tải lại trang.');return}
  const geoms=S.map(objGeom).filter(Boolean);
  if(geoms.length<2){toast('Không đọc được hình dạng của đối tượng');return}
  let res;
  try{
    const pc=polygonClipping;
    res=kind==='union'?pc.union(...geoms):kind==='sub'?pc.difference(geoms[0],...geoms.slice(1)):kind==='int'?pc.intersection(...geoms):pc.xor(...geoms);
  }catch(e){toast('Không thực hiện được phép boolean với các hình này');return}
  if(!res||!res.length){toast('Kết quả rỗng');return}
  const contours=[];
  res.forEach(poly=>poly.forEach(ring=>{
    const r=ring.slice(0,-1);
    if(r.length>=3)contours.push({c:true,n:r.map(p=>({x:p[0],y:p[1],ix:0,iy:0,ox:0,oy:0}))});
  }));
  const base=S[0],top=S[S.length-1];
  pushHistory();
  const o=makePathObj(contours,{name:BOOL_NAME[kind],fill:base.fill||'#D9D9D9',fo:base.fo,grad:base.grad?JSON.parse(JSON.stringify(base.grad)):null,fsid:base.fsid,stroke:base.stroke,sw:base.sw,so:base.so,parent:base.parent});
  if(!o.fill&&!o.grad)o.fill='#D9D9D9';
  const idx=objs.indexOf(top);
  const rm=new Set(S.map(x=>x.id));
  objs.splice(idx+1,0,o);
  objs=objs.filter(x=>!rm.has(x.id));
  sel=new Set([o.id]);render();
}
function flattenSel(){
  const S=selObjs().filter(o=>!['text','inst','image','frame'].includes(o.type));
  if(!S.length){toast('Chọn hình để flatten');return}
  pushHistory();
  if(S.length===1){if(S[0].type!=='path')convertToPath(S[0]);else if(S[0].rot){const c=shapeContours(S[0]);const p=makePathObj(c,{});S[0].pc=p.pc;S[0].x=p.x;S[0].y=p.y;S[0].w=p.w;S[0].h=p.h;S[0].pw=p.pw;S[0].ph=p.ph;S[0].rot=0}render();return}
  const contours=[];S.forEach(o=>shapeContours(o).forEach(c=>contours.push(c)));
  const base=S[0];
  const o=makePathObj(contours,{name:'Flatten',fill:base.fill||'',fo:base.fo,grad:base.grad,fsid:base.fsid,stroke:base.stroke||'#1C1C21',sw:base.sw,parent:base.parent});
  const idx=objs.indexOf(S[S.length-1]),rm=new Set(S.map(x=>x.id));
  objs.splice(idx+1,0,o);objs=objs.filter(x=>!rm.has(x.id));
  sel=new Set([o.id]);render();
}
function maskSel(){
  let S=selObjs();if(!S.length)return;
  if(S.length===1&&S[0].mask){pushHistory();S[0].mask=false;render();return}
  if(S.length===1){
    const o=S[0],sibs=objs.filter(x=>(x.parent||'')===(o.parent||''));
    const i=sibs.indexOf(o);
    if(i>0)S=[sibs[i-1],o];
    else{pushHistory();o.mask=true;render();return}
  }
  pushHistory();
  const f=wrapFrame(S,{name:'Mặt nạ',clip:false});
  const kids=objs.filter(c=>c.parent===f.id);
  kids[kids.length-1].mask=true;
  sel=new Set([f.id]);render();
  toast('Hình trên cùng làm mặt nạ cho các lớp bên dưới nó trong cùng nhóm.');
}

  render();
}

/* ---------- xử lý bảng thuộc tính ---------- */
function setGradStop(o,i,field,v){
  if(!o.grad||!o.grad.s[i])return;
  if(field==='p')o.grad.s[i][0]=clamp(parseFloat(v)/100,0,1);
  else o.grad.s[i][1]=v.toUpperCase();
}
function applyField(k,v,t,S){
  const n=parseFloat(v);
  const each=fn=>S.forEach(fn);
  let m;
  switch(k){
    case 'x':case 'y':{
      if(isNaN(n))return;
      const B=union(S),dx=k==='x'?n-B.x:0,dy=k==='y'?n-B.y:0;
      moveItems(withChildren(S),dx,dy);return;
    }
    case 'w':case 'h':if(isNaN(n))return;resizeBy(S,k,Math.max(0,n));return;
    case 'rot':if(isNaN(n))return;rotateTo(S,n);return;
    case 'r':if(isNaN(n))return;each(o=>{if(['rect','frame','image'].includes(o.type)){o.r=Math.max(0,n);o.rr=null}});return;
    case 'op':if(isNaN(n))return;each(o=>{o.op=clamp(n/100,0,1)});return;
    case 'fo':if(isNaN(n))return;each(o=>{o.fo=clamp(n/100,0,1)});return;
    case 'so':if(isNaN(n))return;each(o=>{o.so=clamp(n/100,0,1)});return;
    case 'sw':if(isNaN(n))return;each(o=>{o.sw=Math.max(0,n)});return;
    case 'fs':if(isNaN(n))return;each(o=>{if(o.type==='text'){o.fs=Math.max(4,n);fitText(o)}});return;
    case 'lh':if(isNaN(n))return;each(o=>{if(o.type==='text'){o.lh=clamp(n/100,.5,5);fitText(o)}});return;
    case 'ls':if(isNaN(n))return;each(o=>{if(o.type==='text'){o.ls=n;fitText(o)}});return;
    case 'n':if(isNaN(n))return;each(o=>{if(o.type==='polygon'||o.type==='star')o.n=clamp(Math.round(n),3,60)});return;
    case 'ir':if(isNaN(n))return;each(o=>{if(o.type==='star')o.ir=clamp(n/100,.05,.95)});return;
    case 'text':each(o=>{if(o.type==='text'){o.text=v;o.rt=null;fitText(o);if(o.cp&&o.cp.text)syncChildToProp(o)}});return;
    case 'ff':each(o=>{o.ff=v;fitText(o)});return;
    case 'fw':each(o=>{o.fw=+v;fitText(o)});return;
    case 'tc':each(o=>{o.tc=v;fitText(o)});return;
    case 'it':each(o=>{o.it=t.checked;fitText(o)});return;
    case 'clip':each(o=>{o.clip=t.checked});return;
    case 'fill':each(o=>{if(!isLineLike(o)){o.fill=v.toUpperCase();o.grad=null;o.fsid=null}});return;
    case 'stroke':each(o=>{if(o.type!=='text')o.stroke=v.toUpperCase()});return;
    case 'fillhex':case 'strokehex':{
      if(!hexOk(v))return;
      const key=k.slice(0,-3),c=full(v).toUpperCase();
      each(o=>{if(key==='fill'){if(!isLineLike(o)){o.fill=c;o.grad=null;o.fsid=null}}else if(o.type!=='text')o.stroke=c});
      const sw=right.querySelector(`input[type=color][data-k="${key}"]`);if(sw)sw.value=full(v);
      return;
    }
    case 'ft':{
      each(o=>{
        if(isLineLike(o))return;
        o.fsid=null;
        const base=o.fill||(o.grad&&o.grad.s[0][1])||'#D9D9D9';
        if(v==='solid'){o.grad=null;if(!o.fill)o.fill=base}
        else if(v==='none'){o.grad=null;o.fill=''}
        else{
          const dark=hexOk(base)&&(parseInt(full(base).slice(1,3),16)*0.3+parseInt(full(base).slice(3,5),16)*0.59+parseInt(full(base).slice(5,7),16)*0.11)<140;
          if(!o.grad)o.grad={t:v,a:90,s:[[0,full(hexOk(base)?base:'#D9D9D9').toUpperCase()],[1,dark?'#FFFFFF':'#1C1C21']]};
          else o.grad.t=v;
        }
      });
      return 'full';
    }
    case 'g.a':if(isNaN(n))return;each(o=>{if(o.grad)o.grad.a=n});return;
    case 'preset':{
      const [w,h]=v.split('x').map(Number);
      if(!w||!h)return;
      const o=S[0];if(o.lay)o.lay.hug=false;
      applyBox(o,{x:o.x,y:o.y,w,h},snapMap(withChildren([o])),objs);
      return 'full';
    }
    case 'startframe':curPage().start=v||null;return 'full';
    case 'lk.to':each(o=>{if(!v)o.link=null;else o.link={to:v,anim:(o.link&&o.link.anim)||'instant'}});return 'full';
    case 'lk.anim':each(o=>{if(o.link)o.link.anim=v});return;
    case 'lgap':if(isNaN(n))return;each(o=>{if(o.lay)o.lay.gap=Math.max(0,n)});return;
    case 'lpx':if(isNaN(n))return;each(o=>{if(o.lay)o.lay.px=Math.max(0,n)});return;
    case 'lpy':if(isNaN(n))return;each(o=>{if(o.lay)o.lay.py=Math.max(0,n)});return;
    case 'setname':objs.filter(x=>x.comp&&x.set===S[0].set).forEach(x=>{x.setName=v});return;
  }
  if(k==='cx'||k==='cy'||k==='bm'||k==='sa'||k==='sd'||k==='sc'||k==='sj'||k==='ss'||k==='se'||k==='fit'){each(o=>{o[k]=v});return}
  if((m=k.match(/^rr([0-3])$/))){
    if(isNaN(n))return;
    each(o=>{if(['rect','frame','image'].includes(o.type)){const a=o.rr||[o.r,o.r,o.r,o.r];a[+m[1]]=Math.max(0,n);o.rr=a}});return;
  }
  if((m=k.match(/^gr\.(\d+)\.(n|g|m|s|o|c)$/))){
    const i=+m[1],f=m[2];
    each(o=>{
      const g=o.grids&&o.grids[i];if(!g)return;
      if(f==='c'){g.c=v.toUpperCase();return}
      if(isNaN(n))return;
      if(f==='o')g.o=clamp(n/100,.01,1);else if(f==='n')g.n=clamp(Math.round(n),1,24);else if(f==='s')g.s=Math.max(2,n);else g[f]=Math.max(0,n);
    });
    return;
  }
  if((m=k.match(/^g\.s\.(\d+)\.(p|c|h)$/))){
    const i=+m[1],f=m[2];
    if(f==='p'&&isNaN(n))return;
    if(f==='h'&&!hexOk(v))return;
    each(o=>setGradStop(o,i,f==='p'?'p':'c',f==='p'?v:(f==='h'?full(v):v)));
    if(f==='c'){const hx=right.querySelector(`input[data-k="g.s.${i}.h"]`);if(hx)hx.value=v.toUpperCase()}
    if(f==='h'){const sw=right.querySelector(`input[type=color][data-k="g.s.${i}.c"]`);if(sw)sw.value=full(v)}
    return;
  }
  if((m=k.match(/^fx\.(\d+)\.(x|y|b|o|c|h)$/))){
    const i=+m[1],f=m[2];
    if(f==='h'){
      if(!hexOk(v))return;

      const sw=right.querySelector(`input[type=color][data-k="fx.${i}.c"]`);if(sw)sw.value=full(v);

      const hx=right.querySelector(`input[data-k="fx.${i}.h"]`);if(hx)hx.value=v.toUpperCase();

    }
    if(isNaN(n))return;
    each(o=>{if(o.fx[i])o.fx[i][f]=f==='o'?clamp(n/100,0,1):(f==='b'?Math.max(0,n):n)});
    return;
  }
  if(k.startsWith('ovt:')||k.startsWith('ovf:')){
    const inst=S[0],cid=k.slice(4);

}

  if(a.startsWith('fxeye:')){const i=+a.slice(6);pushHistory();S.forEach(x=>{if(x.fx&&x.fx[i])x.fx[i].off=!x.fx[i].off});render();return}
  if(a==='group')return groupSel('Group');
  if(a==='mask')return maskSel();
  if(a==='flatten')return flattenSel();
  if(a.startsWith('bool:'))return boolOp(a.slice(5));
  if(['al','ach','ar','at','acv','ab'].includes(a))return align(a,S);
  if(a==='dh')return distribute('h',S);

  if(a==='resetov'){pushHistory();o.ov={};o.props=null;render();return}
  if(a==='uncomp'){

function exportData(S){
  if(S&&S.length===1&&S[0].type==='slice'){
    const sl=S[0],list=objs.filter(o=>o.type!=='slice');
    const ctx={defs:[],idp:'e_',keepRoot:false};
    const body=treeSvg(list,ctx);
    const w=Math.max(1,Math.round(sl.w)),h=Math.max(1,Math.round(sl.h));
    return {svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${r1(sl.x)} ${r1(sl.y)} ${w} ${h}">${ctx.defs.length?`<defs>${ctx.defs.join('')}</defs>`:''}${body}</svg>`,w,h,scoped:true};
  }
  const base=S&&S.length?withChildren(S):objs.filter(o=>!o.parent||!byId(o.parent));
  const list=S&&S.length?base:withChildren(base);
  const vis=list.filter(o=>!o.hidden);
  if(!vis.length)return null;
  const B=union(S&&S.length?topsOf(S).filter(o=>!o.hidden):vis.filter(o=>!o.parent));
  const pad=Math.ceil(Math.max(0,...vis.map(o=>o.stroke&&o.sa!=='i'?o.sw:0)))+ (vis.some(o=>(o.fx||[]).length)?24:0);
  const x=B.x-pad,y=B.y-pad,w=Math.max(1,Math.ceil(B.w+pad*2)),h=Math.max(1,Math.ceil(B.h+pad*2));
  const ctx={defs:[],idp:'e_',keepRoot:true};
  const body=treeSvg(list,ctx);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${r1(x)} ${r1(y)} ${w} ${h}">${ctx.defs.length?`<defs>${ctx.defs.join('')}</defs>`:''}${body}</svg>`;
  return {svg,w,h,scoped:!!(S&&S.length)};
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(_){
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(__){}
    ta.remove();return ok;
  }
}
async function svgToPngBlob(svg,w,h,scale){
  const img=new Image();
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  await img.decode();
  const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);
  const x=c.getContext('2d');x.scale(scale,scale);x.drawImage(img,0,0,w,h);
  return new Promise(r=>c.toBlob(r,'image/png'));
}
async function copyPngOf(S,scale){
  const d=exportData(S&&S.length?S:null);
  if(!d){toast('Chưa có gì để xuất');return}
  try{
    const blob=await svgToPngBlob(d.svg,d.w,d.h,scale||1);
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    toast(`Đã sao chép ảnh PNG ${scale||1}x`);
  }catch(_){toast('Trình duyệt không cho sao chép ảnh. Hãy mở bảng Xuất, nhấp chuột phải vào ảnh xem trước để lưu.')}
}

/* ---------- xuất sang Figma (dán vào plugin Xưởng Vẽ → Figma) ---------- */
function figmaPayload(S){
  syncPageOut();
  const head={xvFigma:1,v:2,styles:doc.styles,vars:doc.vars};
  if(!S||!S.length){
    return JSON.stringify({...head,images:doc.images,pages:doc.pages.map(p=>({name:p.name,objs:p.objs,start:p.start}))},jrep);
  }
  const list=withChildren(topsOf(S));
  const seen=new Set(list.map(o=>o.id)),need=[];
  const queue=[...list];
  const want=id=>{
    if(!id||seen.has(id))return;
    const m=refMaster(id);if(!m)return;
    const mem=m.set?pageObjsOf(m).filter(x=>x.comp&&x.set===m.set):[m];
    mem.forEach(x=>{
      if(seen.has(x.id))return;
      const sub=[x,...subtree(x)];
      sub.forEach(y=>{seen.add(y.id);need.push(y);queue.push(y)});
    });
  };
  while(queue.length){
    const o=queue.pop();
    if(o.type==='inst')want(o.ref);
    (o.cprops||[]).forEach(p=>{if(p.type==='swap')want(p.def)});
    if(o.props)Object.values(o.props).forEach(v=>{if(typeof v==='string'&&v.length<20)want(v)});
  }
  const used=new Set([...list,...need].map(o=>o.src).filter(Boolean));
  const imgs={};used.forEach(id=>{if(doc.images[id])imgs[id]=doc.images[id]});
  const pages=[{name:curPage().name+' (phần chọn)',objs:list,start:null}];
  if(need.length)pages.push({name:'Component từ Xưởng Vẽ',objs:need,start:null});
  return JSON.stringify({...head,images:imgs,pages},jrep);
}

/* ---------- trình chiếu nguyên mẫu ---------- */
let pres=null,presN=0;
function frameSvg(f){
  const list=withChildren([f]);
  const ctx={defs:[],idp:'p'+(++presN)+'_',keepRoot:true};
  const body=treeSvg(list,ctx);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${f.x} ${f.y} ${f.w} ${f.h}" preserveAspectRatio="none">${ctx.defs.length?`<defs>${ctx.defs.join('')}</defs>`:''}${body}</svg>`;
}
function startPresent(){
  endAllModes();
  const frames=objs.filter(f=>f.type==='frame'&&!f.parent&&!f.hidden);
  if(!frames.length){toast('Chưa có Frame nào để trình chiếu. Hãy vẽ một Frame trước.');return}
  const selF=selObjs().find(o=>o.type==='frame'&&!o.parent);
  const st=selF||(curPage().start&&byId(curPage().start))||frames[0];
  pres={stack:[st.id],hint:false,busy:false};
  $('#pres').hidden=false;$('#pres').classList.remove('hint');
  presShow(st.id,'instant');
}
function presClose(){pres=null;$('#pres').hidden=true;$('#pwrap').innerHTML=''}
function presLayout(f){
  const st=$('#pstage').getBoundingClientRect();
  const k=Math.min((st.width-40)/f.w,(st.height-40)/f.h,3);
  const w=f.w*k,h=f.h*k;
  const wr=$('#pwrap');wr.style.width=w+'px';wr.style.height=h+'px';
  return k;
}
function presShow(fid,anim){
  const f=byId(fid);if(!f)return;
  const k=presLayout(f),wr=$('#pwrap');
  $('#pname').textContent=layerName(f);
  const el=document.createElement('div');
  el.className='pf';
  el.innerHTML=frameSvg(f);
  withChildren([f]).forEach(o=>{
    if(!o.link||!o.link.to||o.hidden)return;
    const b=aabb(o),hs=document.createElement('div');
    hs.className='hot';
    hs.style.cssText=`left:${(b.x-f.x)*k}px;top:${(b.y-f.y)*k}px;width:${b.w*k}px;height:${b.h*k}px`;
    hs.title='Nhấp để chuyển màn hình';
    hs.addEventListener('click',()=>presGo(o.link));
    el.appendChild(hs);
  });
  const old=wr.querySelector('.pf');
  if(!old||anim==='instant'){wr.innerHTML='';wr.appendChild(el);return}
  const from={dissolve:'opacity:0','slide-l':'transform:translateX(100%)','slide-r':'transform:translateX(-100%)','slide-u':'transform:translateY(100%)','slide-d':'transform:translateY(-100%)'}[anim]||'';
  const out={dissolve:'opacity:0','slide-l':'transform:translateX(-30%)','slide-r':'transform:translateX(30%)','slide-u':'transform:translateY(-30%)','slide-d':'transform:translateY(30%)'}[anim]||'';
  el.style.cssText+=';'+from;
  wr.appendChild(el);
  void el.offsetWidth;
  el.style.opacity='1';el.style.transform='none';
  old.style.cssText+=';'+out+';pointer-events:none';
  setTimeout(()=>{if(old.parentNode)old.remove()},400);
}
function presGo(link){
  if(!pres)return;
  if(link.to==='back'){presBack();return}
  const t=byId(link.to);if(!t)return;
  pres.stack.push(t.id);presShow(t.id,link.anim||'instant');
}
function presBack(){
  if(!pres||pres.stack.length<2)return;
  pres.stack.pop();presShow(pres.stack[pres.stack.length-1],'dissolve');
}
$('#pclose').onclick=presClose;$('#pback').onclick=presBack;
$('#prestart').onclick=()=>{if(!pres)return;pres.stack=[pres.stack[0]];presShow(pres.stack[0],'dissolve')};

let pendingPaste=false;
document.addEventListener('paste',e=>{
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  pendingPaste=false;
  const cd=e.clipboardData;if(!cd){pasteSel(false);return}
  const files=[...cd.files||[]].filter(f=>/^image\//.test(f.type));
  if(files.length){e.preventDefault();const c=stageCtr();addImages(files,{x:(c.x-view.x)/view.z,y:(c.y-view.y)/view.z});return}
  const txt=cd.getData('text/plain');
  if(txt&&txt.startsWith('xv:')){
    e.preventDefault();
    try{const d=JSON.parse(txt.slice(3));clip=d.o;clip._imgs=d.i;pasteSel(false);return}catch(_){}
  }
  if(txt&&/^\s*<svg[\s>]/i.test(txt)){
    e.preventDefault();
    const c=stageCtr();
    addImages([new File([txt],'vector.svg',{type:'image/svg+xml'})],{x:(c.x-view.x)/view.z,y:(c.y-view.y)/view.z});return;
  }
  if(txt&&txt.trim()){
    e.preventDefault();
    pushHistory();
    const c=stageCtr();
    const o=mk('text',{text:txt.slice(0,2000),x:(c.x-view.x)/view.z-60,y:(c.y-view.y)/view.z-10});
    fitText(o);objs.push(o);settleParents([o]);sel=new Set([o.id]);render();return;
  }

});

/* ---------- biến (variables) và thuộc tính component ---------- */
const BIND_TYPE={fill:'color',stroke:'color',op:'number',sw:'number',r:'number',fs:'number',gap:'number',px:'number',py:'number',w:'number',h:'number',rot:'number',fo:'number',so:'number',text:'string',visible:'boolean'};
const bindType=p=>BIND_TYPE[p]||(/^gs\d+$/.test(p)?'color':undefined);
const bindLabel=p=>BIND_LABEL[p]||(/^gs\d+$/.test(p)?'Màu điểm gradient '+(+p.slice(2)+1):p);
const BIND_LABEL={fill:'Màu nền / màu chữ',stroke:'Màu viền',op:'Độ mờ',sw:'Độ dày viền',r:'Bo góc',fs:'Cỡ chữ',gap:'Khoảng cách',px:'Đệm trái phải',py:'Đệm trên dưới',w:'Chiều rộng',h:'Chiều cao',rot:'Góc xoay',fo:'Độ mờ của nền',so:'Độ mờ của viền',text:'Nội dung chữ',visible:'Hiển thị'};
const FIELD_BIND={w:'w',h:'h',rot:'rot',fo:'fo',so:'so',fill:'fill',fillhex:'fill',stroke:'stroke',strokehex:'stroke',op:'op',sw:'sw',r:'r',fs:'fs',lgap:'gap',lpx:'px',lpy:'py',text:'text'};
const TYPE_LABEL={color:'Màu',number:'Số',string:'Chuỗi',boolean:'Đúng/Sai'};
const eqc=(a,b)=>String(a||'').toUpperCase()===String(b||'').toUpperCase();
const BIND_APPLY={
  fill:(o,v)=>{if(isLineLike(o)||o.type==='image'||o.type==='inst')return false;const c=String(v).toUpperCase();if(eqc(o.fill,c)&&!o.grad&&!o.fsid)return false;o.fill=c;o.grad=null;o.fsid=null;return true},
  stroke:(o,v)=>{if(o.type==='text'||o.type==='inst')return false;const c=String(v).toUpperCase();if(eqc(o.stroke,c))return false;o.stroke=c;return true},
  op:(o,v)=>{const n=clamp((+v||0)/100,0,1);if(o.op===n)return false;o.op=n;return true},
  sw:(o,v)=>{const n=Math.max(0,+v||0);if(o.sw===n)return false;o.sw=n;return true},
  r:(o,v)=>{if(!['rect','frame','image'].includes(o.type))return false;const n=Math.max(0,+v||0);if(o.r===n&&!o.rr)return false;o.r=n;o.rr=null;return true},
  fs:(o,v)=>{if(o.type!=='text')return false;const n=Math.max(4,+v||4);if(o.fs===n)return false;o.fs=n;fitText(o);return true},
  gap:(o,v)=>{if(!o.lay)return false;const n=Math.max(0,+v||0);if(o.lay.gap===n)return false;o.lay.gap=n;return true},
  px:(o,v)=>{if(!o.lay)return false;const n=Math.max(0,+v||0);if(o.lay.px===n)return false;o.lay.px=n;return true},
  py:(o,v)=>{if(!o.lay)return false;const n=Math.max(0,+v||0);if(o.lay.py===n)return false;o.lay.py=n;return true},
  w:(o,v)=>{const n=Math.max(0,+v||0);if(Math.abs(o.w-n)<1e-6)return false;if(o.type==='text'&&o.tm==='auto')o.tm='height';o.w=n;if(o.type==='text')fitText(o);return true},
  h:(o,v)=>{const n=Math.max(0,+v||0);if(Math.abs(o.h-n)<1e-6)return false;if(o.type==='text')o.tm='fixed';o.h=n;return true},
  rot:(o,v)=>{const n=+v||0;if(o.rot===n)return false;o.rot=n;return true},
  fo:(o,v)=>{const n=clamp((+v||0)/100,0,1);if(o.fo===n)return false;o.fo=n;return true},
  so:(o,v)=>{const n=clamp((+v||0)/100,0,1);if(o.so===n)return false;o.so=n;return true},
  text:(o,v)=>{if(o.type!=='text')return false;const s=String(v);if(o.text===s&&!o.rt)return false;o.text=s;o.rt=null;fitText(o);return true},
  visible:(o,v)=>{const h=!(v===true||v==='true'||v===1);if(o.hidden===h)return false;o.hidden=h;return true}
};
function findVar(id){
  for(const c of doc.vars.cols){const v=c.vars.find(x=>x.id===id);if(v)return {v,c}}
  return null;
}
/* bản đồ chế độ của một đối tượng: gom chế độ đặt trên các khung cha */
function modesOf(o,list,base){
  const get=id=>list?list.find(x=>x.id===id):byId(id);
  const chain=[];let q=o,n=0;
  while(q&&n++<60){if(q.vm)chain.push(q.vm);q=q.parent?get(q.parent):null}
  const m={...(base||{})};
  chain.reverse().forEach(vm=>Object.assign(m,vm));
  return m;
}
function varValue(vid,modes,depth){
  depth=depth||0;
  const f=findVar(vid);if(!f||depth>8)return undefined;
  const mid=modes[f.c.id]||f.c.def||f.c.modes[0].id;
  let v=f.v.vals[mid];
  if(v===undefined)v=f.v.vals[f.c.modes[0].id];
  if(v&&typeof v==='object'&&v.alias)return varValue(v.alias,modes,depth+1);
  return v;
}
function bindApply(o,modes){
  const b=o.bind;if(!b)return false;
  let ch=false;
  Object.keys(b).forEach(prop=>{
    const val=varValue(b[prop],modes);if(val===undefined)return;
    if(/^gs\d+$/.test(prop)){
      const i=+prop.slice(2);
      if(o.grad&&o.grad.s[i]&&!eqc(o.grad.s[i][1],val)){o.grad.s[i][1]=String(val).toUpperCase();ch=true}
      return;
    }
    const A=BIND_APPLY[prop];if(A&&A(o,val))ch=true;
  });
  return ch;
}
function applyBindings(){
  if(!doc.vars.cols.length)return;
  objs.forEach(o=>{if(o.bind)bindApply(o,modesOf(o))});
}
function bindName(o,prop){
  const id=o.bind&&o.bind[prop];if(!id)return null;
  const f=findVar(id);return f?f.v.name:'(biến đã xoá)';
}
function cleanBinds(pred){
  objs.forEach(o=>{if(o.bind){Object.keys(o.bind).forEach(k=>{if(pred(o.bind[k]))delete o.bind[k]});if(!Object.keys(o.bind).length)o.bind=null}});
}

/* ---------- gắn biến vào thuộc tính ---------- */
function valPreview(v,val){
  if(v.type==='color')return `<span class="sw sm" style="width:18px;height:18px"><span class="fillbg" style="position:absolute;inset:0;background:${esc(val)}"></span></span>`;
  if(v.type==='boolean')return `<span class="cnt">${val?'Đúng':'Sai'}</span>`;
  return `<span class="cnt">${esc(String(val).slice(0,14))}</span>`;
}
function currentValueFor(o,prop){
  switch(prop){
    case 'fill':return o.fill||'#D9D9D9';case 'stroke':return o.stroke||'#1C1C21';
    case 'op':return Math.round(o.op*100);case 'sw':return o.sw;case 'r':return o.r||0;case 'fs':return o.fs;
    case 'gap':return o.lay?o.lay.gap:0;case 'px':return o.lay?(o.lay.px!=null?o.lay.px:o.lay.pad):0;case 'py':return o.lay?(o.lay.py!=null?o.lay.py:o.lay.pad):0;
    case 'text':return o.text;case 'visible':return !o.hidden;
    case 'w':return r1(o.w);case 'h':return r1(o.h);case 'rot':return o.rot||0;case 'fo':return Math.round((o.fo==null?1:o.fo)*100);case 'so':return Math.round((o.so==null?1:o.so)*100);
  }
  if(/^gs\d+$/.test(prop)){const st=o.grad&&o.grad.s[+prop.slice(2)];return st?st[1]:'#D9D9D9'}
  return '';
}
function openBindPop(btn,prop){
  const S=selObjs(),o=S[0];if(!o)return;
  const type=bindType(prop);
  let items='';
  doc.vars.cols.forEach(c=>{
    const vs=c.vars.filter(v=>v.type===type);
    if(!vs.length)return;
    items+=`<div class="lb">${esc(c.name)}</div>`;
    vs.forEach(v=>{
      const val=varValue(v.id,{});
      items+=popItem('bind:'+v.id,`${valPreview(v,val)}${esc(v.name)}`,'',o.bind&&o.bind[prop]===v.id);
    });
  });
  if(!items)items='<div class="empty" style="padding:6px 10px">Chưa có biến loại "'+TYPE_LABEL[type]+'".</div>';
  const html=`<div class="lb">Gắn biến cho: ${bindLabel(prop)}</div>${items}<div class="sp1"></div>${popItem('create','Tạo biến mới từ giá trị này')}${o.bind&&o.bind[prop]?popItem('unbind','Gỡ biến'):''}${popItem('open','Mở bảng biến')}`;
  showPop(btn,html,a=>{
    if(a==='open'){openVarsModal();return}
    if(a==='unbind'){pushHistory();S.forEach(x=>{if(x.bind){delete x.bind[prop];if(!Object.keys(x.bind).length)x.bind=null}});render();return}
    if(a==='create'){
      pushHistory();
      if(!doc.vars.cols.length)doc.vars.cols.push(newCol('Bộ biến 1'));
      const col=doc.vars.cols[0];
      const val=currentValueFor(o,prop),vv={};
      col.modes.forEach(m=>{vv[m.id]=val});
      const nv={id:'v_'+uid(),name:uniqueVarName(col,bindLabel(prop)),type,vals:vv};
      col.vars.push(nv);
      S.forEach(x=>{x.bind=x.bind||{};x.bind[prop]=nv.id});
      render();toast('Đã tạo biến "'+nv.name+'" trong "'+col.name+'". Chỉnh giá trị theo từng chế độ trong Bảng biến.');return;
    }
    if(a.startsWith('bind:')){
      pushHistory();
      S.forEach(x=>{x.bind=x.bind||{};x.bind[prop]=a.slice(5)});
      render();
    }
  },{alignRight:true});
}
function uniqueVarName(col,base){
  let n=base,i=1;
  while(col.vars.some(v=>v.name===n))n=base+' '+(++i);
  return n;
}
const bindBtn=(prop,cls='mini')=>`<button class="${cls}" data-act="bind:${prop}" title="Gắn biến: ${bindLabel(prop)}" aria-label="Gắn biến">${ic('var',14)}</button>`;
function boundChip(o,prop,label){

function refreshVarsModal(){$('#mbody').innerHTML=varsHtml()}
const varsOpen=()=>!$('#modal').hidden&&$('#mtitle').textContent==='Biến (variables)';
function varStart(){if(!varsDirty){pushHistory();varsDirty=true}}
$('#mbody').addEventListener('focusin',()=>{varsDirty=false});
$('#mbody').addEventListener('input',e=>{
  if(!varsOpen())return;
  const t=e.target,d=t.dataset;
  const col=id=>doc.vars.cols.find(c=>c.id===id);
  if(d.vc){varStart();col(d.vc).name=t.value;return}
  if(d.vdef){varStart();col(vcur).def=t.value;render({noPanel:true});return}
  if(d.vm){varStart();const [c,m]=d.vm.split('|');col(c).modes.find(x=>x.id===m).name=t.value;return}
  if(d.vn){varStart();const [c,v]=d.vn.split('|');col(c).vars.find(x=>x.id===v).name=t.value;return}
  if(d.vv||d.vvh){
    const [c,v,m]=(d.vv||d.vvh).split('|');
    const vr=col(c).vars.find(x=>x.id===v);
    let val;
    if(d.vvh){if(!hexOk(t.value))return;val=full(t.value).toUpperCase();const sw=$('#mbody').querySelector(`input[data-vv="${d.vvh}"]`);if(sw)sw.value=val}
    else if(vr.type==='color'){val=t.value.toUpperCase();const hx=$('#mbody').querySelector(`input[data-vvh="${d.vv}"]`);if(hx)hx.value=val}
    else if(vr.type==='number'){val=parseFloat(t.value);if(isNaN(val))return}
    else if(vr.type==='boolean'){val=t.checked;if(t.parentElement)t.parentElement.lastChild.textContent=' '+(val?'Đúng':'Sai')}
    else val=t.value;
    varStart();vr.vals[m]=val;
    render({noPanel:true});
  }
});
$('#mbody').addEventListener('click',e=>{
  if(!varsOpen())return;
  const b=e.target.closest('[data-va]');if(!b)return;
  const [a,arg]=b.dataset.va.split(/:(.+)/);
  const col=id=>doc.vars.cols.find(c=>c.id===id);
  if(a==='alias'||a==='unalias'){
    const [cid,vid,mid]=arg.split('|');
    const c=col(cid),v=c.vars.find(x=>x.id===vid);
    if(a==='unalias'){pushHistory();v.vals[mid]=varValue(v.id,{[cid]:mid})!==undefined?varValue(v.id,{[cid]:mid}):defaultFor(v.type);render();refreshVarsModal();return}
    let items='';
    doc.vars.cols.forEach(cc=>{
      const vs=cc.vars.filter(x=>x.type===v.type&&x.id!==v.id);
      if(!vs.length)return;
      items+=`<div class="lb">${esc(cc.name)}</div>`+vs.map(x=>popItem('al:'+x.id,`${valPreview(x,varValue(x.id,{}))}${esc(x.name)}`)).join('');
    });
    if(!items)items='<div class="empty" style="padding:6px 10px">Chưa có biến khác cùng loại để tham chiếu.</div>';
    showPop(b,`<div class="lb">Tham chiếu tới biến</div>${items}`,act=>{
      if(!act.startsWith('al:'))return;
      pushHistory();v.vals[mid]={alias:act.slice(3)};render();refreshVarsModal();
    });
    return;
  }
  if(a==='tab'){vcur=arg;refreshVarsModal();return}
  if(a==='addcol'){pushHistory();const c=newCol('Bộ biến '+(doc.vars.cols.length+1));doc.vars.cols.push(c);vcur=c.id;refreshVarsModal();return}
  if(a==='delcol'){
    pushHistory();
    const c=col(arg),ids=new Set(c.vars.map(v=>v.id));
    cleanBinds(id=>ids.has(id));
    objs.forEach(o=>{if(o.vm){delete o.vm[arg];if(!Object.keys(o.vm).length)o.vm=null}});
    doc.vars.cols=doc.vars.cols.filter(x=>x!==c);
    vcur=doc.vars.cols[0]?doc.vars.cols[0].id:null;
    if(!doc.vars.cols.length)doc.vars.cols.push(newCol('Bộ biến 1')),vcur=doc.vars.cols[0].id;
    refreshVarsModal();render();return;
  }
  if(a==='addmode'){
    pushHistory();const c=col(arg),m={id:'m_'+uid(),name:'Chế độ '+(c.modes.length+1)};
    c.vars.forEach(v=>{v.vals[m.id]=v.vals[c.modes[0].id]});
    c.modes.push(m);refreshVarsModal();return;
  }
  if(a==='delmode'){
    const [c,m]=arg.split('|'),cl=col(c);
    if(cl.modes.length<2)return;
    pushHistory();
    cl.modes=cl.modes.filter(x=>x.id!==m);
    cl.vars.forEach(v=>{delete v.vals[m]});
    if(cl.def===m)cl.def=cl.modes[0].id;
    objs.forEach(o=>{if(o.vm&&o.vm[c]===m){delete o.vm[c];if(!Object.keys(o.vm).length)o.vm=null}});
    refreshVarsModal();render();return;
  }
  if(a==='addvar'){
    pushHistory();
    const c=col(arg),type=$('#vtype').value,vv={};
    c.modes.forEach(m=>{vv[m.id]=defaultFor(type)});
    c.vars.push({id:'v_'+uid(),name:uniqueVarName(c,TYPE_LABEL[type]),type,vals:vv});
    refreshVarsModal();return;
  }
  if(a==='delvar'){
    const [c,v]=arg.split('|');
    pushHistory();
    cleanBinds(id=>id===v);
    const cl=col(c);cl.vars=cl.vars.filter(x=>x.id!==v);
    refreshVarsModal();render();
  }
});

/* ---------- thuộc tính component ---------- */
const CP_ICON={bool:'eye',text:'text',swap:'inst',slot:'frame'};
const CP_TYPE_LABEL={bool:'Hiện/ẩn',text:'Chữ',swap:'Hoán đổi',slot:'Khe nội dung'};
function masterOf(o){
  let q=o,n=0;
  while(q&&n++<60){if(q.type==='frame'&&q.comp)return q;q=q.parent?byId(q.parent):null}
  return null;
}
const ancestorMaster=o=>{const p=o.parent&&byId(o.parent);return p?masterOf(p):null};
const setMembers=m=>m.set?objs.filter(x=>x.comp&&x.set===m.set):[m];
function addCProp(m,type,name,def){
  const id='cp_'+uid();
  setMembers(m).forEach(x=>{x.cprops=x.cprops||[];x.cprops.push({id,name,type,def})});
  return id;
}
function cpropIn(m,id){return (m.cprops||[]).find(p=>p.id===id)}
function compsList(){
  const out=objs.filter(o=>o.type==='frame'&&o.comp);
  doc.pages.forEach(p=>{if(p!==curPage())p.objs.forEach(o=>{if(o.type==='frame'&&o.comp)out.push(o)})});
  return out;
}
/* đồng bộ giá trị mặc định của thuộc tính xuống các lớp con đang gắn trong component gốc */
function syncPropToKids(m,p){
  subtree(m).forEach(c=>{
    if(!c.cp)return;
    if(c.cp.vis===p.id)c.hidden=!p.def;
    if(c.cp.text===p.id&&c.type==='text'){c.text=String(p.def);fitText(c)}
    if(c.cp.swap===p.id&&c.type==='inst'&&byId(p.def)){c.ref=p.def}
  });
}
function syncChildToProp(o){
  const m=ancestorMaster(o);if(!m||!o.cp)return;
  const upd=(id,def)=>setMembers(m).forEach(x=>{const p=cpropIn(x,id);if(p)p.def=def});
  if(o.cp.vis)upd(o.cp.vis,!o.hidden);
  if(o.cp.text&&o.type==='text')upd(o.cp.text,o.text);
  if(o.cp.swap&&o.type==='inst')upd(o.cp.swap,o.ref);
}

}

function cpropInstHtml(o,m){
  const P=m.cprops||[];
  if(!P.length)return '';

  });
  return h;
}
function cpropChildSection(S){

}

function actVars(a,btn){
  if(a==='varsmodal'){openVarsModal();return true}
  if(a.startsWith('bind:')){openBindPop(btn,a.slice(5));return true}
  if(a.startsWith('unbind:')){
    const prop=a.slice(7),S=selObjs();pushHistory();
    S.forEach(x=>{if(x.bind){delete x.bind[prop];if(!Object.keys(x.bind).length)x.bind=null}});
    render();return true;
  }
  if(a.startsWith('slotclear:')){
    const pid=a.slice(10),o=selObjs()[0];if(!o)return true;
    pushHistory();
    const del=new Set(withChildren(objs.filter(c=>c.parent===o.id&&c.slot===pid)).map(c=>c.id));
    objs=objs.filter(c=>!del.has(c.id));render();return true;
  }
  if(a==='resetprops'){const o=selObjs()[0];if(o){pushHistory();o.props=null;render()}return true}
  if(a==='cpadd'){
    const m=selObjs()[0];if(!m||!m.comp)return true;
    showPop(btn,popItem('bool','Hiện / ẩn (Boolean)')+popItem('text','Nội dung chữ (Text)')+popItem('swap','Hoán đổi bản sao (Instance swap)')+popItem('slot','Khe nội dung (Slot)'),t=>{
      pushHistory();
      const first=compsList().find(c=>c.id!==m.id);
      addCProp(m,t,t==='bool'?'Hiện':t==='text'?'Nội dung':t==='slot'?'Khe':'Hoán đổi',t==='bool'?true:t==='text'?'Văn bản':t==='slot'?null:(first?first.id:''));
      if(t==='slot')toast('Chọn một khung bên trong component rồi gắn vào thuộc tính "Khe" ở mục Thuộc tính component.');
      render();
    },{alignRight:true});
    return true;
  }
  if(a.startsWith('cpdel:')){
    const id=a.slice(6),m=selObjs()[0];if(!m)return true;
    pushHistory();
    const mm=masterOf(m)||m;
    setMembers(mm).forEach(x=>{x.cprops=(x.cprops||[]).filter(p=>p.id!==id);if(!x.cprops.length)x.cprops=null;
      subtree(x).forEach(c=>{if(c.cp){['vis','text','swap','slot'].forEach(k=>{if(c.cp[k]===id)delete c.cp[k]});if(!Object.keys(c.cp).length)c.cp=null}})});
    objs.forEach(i=>{if(i.props&&id in i.props){delete i.props[id];if(!Object.keys(i.props).length)i.props=null}});
    render();return true;
  }
  if(a.startsWith('cp-mk:')){
    const kind=a.slice(6),o=selObjs()[0];if(!o)return true;
    const m=ancestorMaster(o);if(!m)return true;
    pushHistory();
    const nm=layerName(o);
    const id=kind==='vis'?addCProp(m,'bool','Hiện '+nm,!o.hidden):kind==='text'?addCProp(m,'text',nm,o.text):kind==='slot'?addCProp(m,'slot','Khe '+nm,null):addCProp(m,'swap','Hoán đổi '+nm,o.ref);
    o.cp=o.cp||{};o.cp[kind]=id;
    render();return true;
  }
  return false;
}

/* ---------- bàn phím ---------- */
window.addEventListener('keydown',e=>{
  const tg=e.target;
  const typing=tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable);
  if(pres){
    if(e.key==='Escape')presClose();
    else if(e.key==='Backspace'||e.key==='ArrowLeft'){e.preventDefault();presBack()}
    else if(e.key.toLowerCase()==='r')$('#prestart').click();
    else if(e.key.toLowerCase()==='h')$('#phint').click();
    return;
  }
  if(e.key==='Alt'&&!typing){
    e.preventDefault();altDown=true;
    if(hover&&sel.size&&!sel.has(hover)){measure={a:union(selObjs()),b:aabb(byId(hover))};drawOverlay()}
    return;
  }
  if(e.key==='Escape'){
    if(!$('#modal').hidden){closeModal();return}
    if(!pop.hidden){hidePop();return}
    if(typing){tg.blur();return}
    if(vedit){exitVedit();return}
    if(pen){penFinish();return}
    if(pencil){pencil=null;drawOverlay();return}
    if(tool!=='select'){setTool('select');return}
    sel=new Set();render();return;
  }
  if(typing)return;
  // đang mở hộp thoại: không để phím tắt tác động lên bản vẽ phía sau
  if(!$('#modal').hidden)return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase(),code=e.code;
  if(code==='Space'&&!e.repeat){spaceDown=true;cv.style.cursor='grab';e.preventDefault();return}
  if(mod){
    if(e.altKey){
      e.preventDefault();
      if(e.shiftKey&&code==='KeyA'){pushHistory();selObjs().forEach(o=>{if(o.type==='frame')o.lay=null});render()}
      else if(e.shiftKey&&code==='KeyV')distribute('v',selObjs());
      else if(code==='KeyK')makeComponent();
      else if(code==='KeyB')detachSel();
      else if(code==='KeyG')groupSel('Frame');
      else if(code==='KeyC')copyProps();
      else if(code==='KeyV')pasteProps();
      else if(code==='KeyM')maskSel();
      else if(code==='KeyU')boolOp('union');
      else if(code==='KeyS')boolOp('sub');
      else if(code==='KeyI')boolOp('int');
      else if(code==='KeyX')boolOp('xor');
      else if(code==='KeyH')distribute('h',selObjs());
      else if(code==='Enter')startPresent();
      return;
    }
    if(e.shiftKey&&code==='KeyK'){e.preventDefault();$('#imgIn').click();return}
    if(e.shiftKey&&code==='KeyE'){e.preventDefault();openExport();return}
    if(e.shiftKey&&code==='KeyC'){e.preventDefault();copyPngOf(selObjs(),2);return}
    if(k==='s'&&!e.shiftKey){e.preventDefault();if(CAN_DL)saveDocFile();else toast('Bản vẽ được tự lưu trong trình duyệt.');return}
    if(k==='o'&&!e.shiftKey){e.preventDefault();if(CAN_DL)$('#docIn').click();return}
    if(k==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo()}
    else if(k==='y'){e.preventDefault();doRedo()}
    else if(k==='a'){e.preventDefault();const hid=hiddenIds();sel=new Set(objs.filter(o=>!hid.has(o.id)&&!o.locked&&!o.parent).map(o=>o.id));render()}
    else if(k==='c'){copySel()}
    else if(k==='x'){copySel();setTimeout(()=>{if(sel.size)delSel()},100)}
    else if(k==='v'){pendingPaste=true;setTimeout(()=>{if(pendingPaste){pendingPaste=false;pasteSel(e.shiftKey)}},90)}
    else if(k==='d'){e.preventDefault();dupSel()}
    else if(k==='g'){e.preventDefault();e.shiftKey?ungroupSel():groupSel('Group')}
    else if(k==='h'&&e.shiftKey){e.preventDefault();toggleFlag('hidden')}
    else if(k==='l'&&e.shiftKey){e.preventDefault();toggleFlag('locked')}
    else if(k==='e'){e.preventDefault();flattenSel()}
    else if(k==='r'){e.preventDefault();renameSel()}
    else if(k===']'){e.preventDefault();moveZ(1,true)}
    else if(k==='['){e.preventDefault();moveZ(-1,true)}
    else if(k==="'"){e.preventDefault();pxGrid=!pxGrid;render({noLayers:true,noPanel:true})}
    else if(k==='0'){e.preventDefault();const c=stageCtr();zoomAt(c.x,c.y,1)}
    else if(k==='='||k==='+'){e.preventDefault();const c=stageCtr();zoomAt(c.x,c.y,view.z*1.25)}
    else if(k==='-'){e.preventDefault();const c=stageCtr();zoomAt(c.x,c.y,view.z/1.25)}
    return;
  }
  if(e.key==='F2'){e.preventDefault();renameSel();return}
  if(e.key==='?'||(e.shiftKey&&code==='Slash')){e.preventDefault();openModal('Phím tắt','<div style="columns:2 220px;column-gap:24px">'+keysHtml()+'</div>');return}
  if(e.key==='Backspace'||e.key==='Delete'){
    e.preventDefault();
    if(pen){pen.nodes.pop();if(!pen.nodes.length)pen=null;drawOverlay();return}
    if(vedit){deleteVNode();return}
    delSel();return;
  }
  if(e.key==='Enter'){
    e.preventDefault();
    if(pen){penFinish();return}
    if(vedit){exitVedit();return}
    enterSel(e.shiftKey);return;
  }
  if(e.shiftKey&&code==='Digit1'){fitView();return}
  if(e.shiftKey&&code==='Digit2'){fitView(selObjs());return}
  if(e.shiftKey&&code==='Digit0'){const c=stageCtr();zoomAt(c.x,c.y,1);return}
  if(e.shiftKey&&k==='a'){e.preventDefault();addLayout();return}
  if(e.shiftKey&&k==='h'){e.preventDefault();flipSel('x');return}
  if(e.shiftKey&&k==='v'){e.preventDefault();flipSel('y');return}
  if(e.shiftKey&&k==='r'){e.preventDefault();toggleRulers();return}
  if(e.shiftKey&&k==='l'){e.preventDefault();setTool('arrow');return}
  if(e.shiftKey&&k==='p'){e.preventDefault();setTool('pencil');return}
  if(e.shiftKey&&k==='s'){e.preventDefault();setTool('section');return}
  const alg={KeyA:'al',KeyD:'ar',KeyW:'at',KeyS:'ab',KeyH:'ach',KeyV:'acv'};
  if(e.altKey&&!e.shiftKey&&alg[code]){
    e.preventDefault();
    const S=selObjs();
    if(S.length>1||(S.length===1&&S[0].parent&&byId(S[0].parent)))align(alg[code],S);
    else toast('Chọn nhiều đối tượng, hoặc một đối tượng nằm trong khung, để căn chỉnh');
    return;
  }
  if(e.key==='['){moveZ(-1,false);return}
  if(e.key===']'){moveZ(1,false);return}
  if(e.key==='Tab'){e.preventDefault();selectSibling(e.shiftKey?-1:1);return}
  if(e.key==='\\'){e.preventDefault();enterSel(true);return}
  if(/^Digit\d$/.test(code)&&!e.shiftKey&&!e.altKey){
    const S=selObjs();
    if(S.length){pushHistory();const d=+code.slice(5);S.forEach(o=>{o.op=d===0?1:d/10});render()}
    return;
  }
  const arrows={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(arrows[e.key]){
    const S=withChildren(selObjs()).filter(o=>!o.locked);
    if(!S.length)return;
    e.preventDefault();
    if(!e.repeat)pushHistory();
    const st=e.shiftKey?10:1;
    S.forEach(o=>{o.x+=arrows[e.key][0]*st;o.y+=arrows[e.key][1]*st});
    render();return;
  }
  const map={v:'select',f:'frame',a:'frame',r:'rect',o:'ellipse',l:'line',p:'pen',t:'text',h:'hand',k:'scale',s:'slice'};
  if(map[k]&&!e.shiftKey){e.preventDefault();setTool(map[k])}
});

  if(e.code==='Space'){spaceDown=false;cv.style.cursor=cursorFor()}
  if(e.key==='Alt'){altDown=false;if(measure){measure=null;drawOverlay()}}

function assignParentIn(list,o){
  if(o.type==='frame'&&o.comp)return;
  const cx=o.x+o.w/2,cy=o.y+o.h/2;let f=null;
  for(let i=list.length-1;i>=0;i--){
    const c=list[i];
    if(c.type==='frame'&&c!==o&&cx>=c.x&&cx<=c.x+c.w&&cy>=c.y&&cy<=c.y+c.h){f=c;break}
  }
  o.parent=f?f.id:null;
}

      }
    }catch(e){d=null}

  else{loadDoc({pages:[{name:'Trang 1'}]});objs=buildSeed();curPage().objs=objs}
  setTool('select');syncHist();render();

}
